# URY Dashboard — Stale Issue & PR Management
# Automatically marks inactive issues and PRs as stale, then closes them

name: Stale

on:
  schedule:
    - cron: "0 6 * * 1"  # Every Monday at 06:00 UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Manage Stale Items
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

          # Issue settings
          stale-issue-message: |
            This issue has been inactive for 60 days and will be closed in 14 days if there is no further activity.
            If this issue is still relevant, please add a comment to keep it open.
          close-issue-message: |
            This issue was closed due to inactivity. Feel free to reopen it if it is still relevant.
          stale-issue-label: "stale"
          days-before-issue-stale: 60
          days-before-issue-close: 14

          # PR settings
          stale-pr-message: |
            This pull request has been inactive for 30 days and will be closed in 7 days if there is no further activity.
            If this PR is still being worked on, please add a comment or push a commit to keep it open.
          close-pr-message: |
            This pull request was closed due to inactivity. Feel free to reopen it when ready.
          stale-pr-label: "stale"
          days-before-pr-stale: 30
          days-before-pr-close: 7

          # Exemptions
          exempt-issue-labels: "pinned,security,blocked"
          exempt-pr-labels: "pinned,security,blocked"
          exempt-draft-pr: true

          # Operations per run
          operations-per-run: 50
