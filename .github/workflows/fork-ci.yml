# URY Dashboard — Fork CI Pipeline
# Runs CI checks on the fork repository, bypassing the upstream approval requirement.
# This allows contributors to validate their changes before the upstream admin approves.
#
# Triggers on push to feature branches and PRs within the fork.

name: Fork CI

on:
  push:
    branches: [develop, 'feature/**', 'infra/**', 'fix/**']
  pull_request:
    branches: [develop]

concurrency:
  group: fork-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ── Lint & Type Check ─────────────────────────────────────
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    # Only run on the fork, not on upstream
    if: github.repository != 'ury-erp/ury'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Get yarn cache directory
        id: yarn-cache
        run: echo "dir=$(yarn config get cacheFolder)" >> $GITHUB_OUTPUT

      - uses: actions/cache@v4
        with:
          path: ${{ steps.yarn-cache.outputs.dir }}
          key: yarn-${{ runner.os }}-${{ hashFiles('**/yarn.lock', '**/package.json') }}
          restore-keys: |
            yarn-${{ runner.os }}-

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache || yarn install --frozen-lockfile || yarn install

      - name: Run ESLint
        run: yarn lint
        continue-on-error: true

      - name: TypeScript type check (UI package)
        run: yarn --cwd packages/ui typecheck
        continue-on-error: true

  # ── Storybook Build ───────────────────────────────────────
  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: lint
    if: github.repository != 'ury-erp/ury'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache || yarn install --frozen-lockfile || yarn install

      - name: Build Storybook
        run: yarn build-storybook

  # ── Build Verification ────────────────────────────────────
  build:
    name: Build Verification
    runs-on: ubuntu-latest
    needs: lint
    if: github.repository != 'ury-erp/ury'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --immutable --immutable-cache || yarn install --frozen-lockfile || yarn install

      - name: Build all workspaces
        run: yarn build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
        continue-on-error: true

  # ── Report Status ─────────────────────────────────────────
  report:
    name: CI Status Report
    runs-on: ubuntu-latest
    needs: [lint, storybook, build]
    if: always() && github.repository != 'ury-erp/ury'
    steps:
      - name: Summary
        run: |
          echo "## Fork CI Results" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Storybook Build | ${{ needs.storybook.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Verification | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
