name: Feature Request
description: Suggest a new feature or enhancement for URY
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feature suggestion! Please describe your idea clearly so we can evaluate it.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of URY would this feature affect?
      options:
        - Dashboard (Next.js frontend)
        - POS v2 (React app)
        - @ury/ui (shared components)
        - Backend (Frappe/Python)
        - Infrastructure (CI/Docker)
        - Storybook
        - Other
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? Why is it needed?
      placeholder: "Kitchen staff cannot see real-time order updates without refreshing the page, causing delays."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe your proposed solution or approach.
      placeholder: "Add a WebSocket-based live order feed to the kitchen display that updates automatically when new orders arrive."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Have you considered any alternative solutions or workarounds?
      placeholder: "Polling the API every 5 seconds, but this creates unnecessary server load."
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Mockups, references, links to similar features in other systems, etc.
    validations:
      required: false
