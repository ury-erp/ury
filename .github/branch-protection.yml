# URY Dashboard — Branch Protection Configuration
# This file documents the required branch protection settings for the repository.
# Apply these settings via GitHub Settings API or GitHub UI.
#
# To apply automatically, run: node scripts/apply-branch-protection.mjs

branches:
  main:
    description: "Production branch — only merge via approved PRs"
    protection:
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: true
        required_approving_review_count: 2
        require_last_push_approval: true
      required_status_checks:
        strict: true           # require branch to be up to date before merging
        contexts:
          - "Lint & Type Check"
          - "Unit Tests"
          - "Build Verification"
      enforce_admins: true     # admins must follow rules too
      required_linear_history: true
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null       # no restrict to specific users/teams

  develop:
    description: "Development branch — integration branch for features"
    protection:
      required_pull_request_reviews:
        dismiss_stale_reviews: true
        require_code_owner_reviews: false
        required_approving_review_count: 1
      required_status_checks:
        strict: true
        contexts:
          - "Lint & Type Check"
          - "Unit Tests"
          - "Build Verification"
      enforce_admins: false
      required_linear_history: false
      allow_force_pushes: false
      allow_deletions: false
      restrictions: null
