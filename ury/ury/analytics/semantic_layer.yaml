  - {id: p_kot_stages, title: "probe fact_kot_stages", query: fact_kot_stages, type: Number, y: [{column: kot, agg: count, as: Rows}]}
  - {id: p_invoices_w, title: "probe fact_invoices_w", query: fact_invoices_w, type: Number, y: [{column: name, agg: count, as: Rows}]}
  - {id: p_invoices_named, title: "probe fact_invoices_named", query: fact_invoices_named, type: Number, y: [{column: name, agg: count, as: Rows}]}
  - {id: p_cancellations_named, title: "probe fact_cancellations_named", query: fact_cancellations_named, type: Number, y: [{column: name, agg: count, as: Rows}]}
  - {id: p_bills_all, title: "probe fact_bills_all", query: fact_bills_all, type: Number, y: [{column: name, agg: count, as: Rows}]}
  - {id: p_returns, title: "probe fact_returns", query: fact_returns, type: Number, y: [{column: name, agg: count, as: Rows}]}
