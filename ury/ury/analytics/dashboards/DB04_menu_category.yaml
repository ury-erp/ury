# DB04 Menu and category, DAILY view (redesign 2026-11-24). Audience: owner, branch manager, kitchen head.
# Same pattern as DB01 / DB02 / DB03: ONE Date filter (`within`, default {span: current day, anchor: latest day with sales}; the importer fills the
# __LATEST_DAY__ anchor and refresh_latest_day_defaults moves it nightly). Clear it for all dates (last 93 days), or pick a range.
# Number cards and charts (fact_items) follow Date, Branch, Category and Service: a card shows the total for the dates picked (latest day by default).
# Cards use compare_previous: % change vs the previous period (needs a `within` Date) + trend line for periods of a week or more; a `between` range or cleared Date shows the total only. The "latest vs previous day" dish chart (fact_card_items) always shows those two days.
# fact_card_items / fact_items: one row per day x branch x service x category x dish (no duplicates; last 93 days before the latest sales day).
# Margin and non-selling tables keep their line-level / item-level queries. No currency symbols anywhere. Insights runs these queries on DuckDB.
workbook: {id: ury_db04_menu_category, title: "Menu and category", module: "URY", required_apps: [ury]}
queries:
  # fact_card_items (sql): latest-vs-previous-day dishes chart only. Not linked to Date.
  - id: fact_card_items
    title: "fact_card_items"
    sql: "WITH cm AS (SELECT ig.name AS item_group, CASE WHEN ig.name IN ('Dessert','Desserts','Pastry','Ice cream') THEN 'Desserts' WHEN ig.name IN ('Soups','Soups&Salads','SALADS','Salad Chicken') THEN 'Soups & Salads' WHEN ig.name IN ('Grills & BBQ','CHARCOL GRILLED','Grilled Specials','Chicken Al Fahams','KEBAB','Chicken Kebabs') THEN 'Grills & Kebabs' WHEN ig.name IN ('RICE','Biryani & Rice','Special Rice') THEN 'Rice & Biryani' WHEN ig.name IN ('Curries','GRAVY','GARAVIES','Main Course') THEN 'Mains & Curries' WHEN ig.name IN ('BURGER & WRAPS','Burgers & Sandwiches') THEN 'Burgers & Wraps' WHEN ig.name IN ('COMBOS','COMBO-LULU','PLATTER') THEN 'Combos & Platters' WHEN ig.name IN ('Soft Drinks','Cool Drinks','Soft Drink Spl','Soft Drink Can') THEN 'Soft Drinks' WHEN ig.name IN ('Juices&Mocktails','Smoothies','Beverages') THEN 'Juices & Beverages' WHEN ig.name = 'All Item Groups' THEN 'Unassigned' WHEN ig.name IN ('Raw Material','Services','Sub Assemblies','Consumable','Central Store','Burning Materials','Cleaning Material','Disposable','Chicken','Frozen Goods','Groceries','Milk & Curd','FISH','Provision','Sauces','Powder','Oil','Fruits','Kitchen Materials','Vegetable','VEGETABLES','Cleaning','Burning','GROCERY','Disposables','Ejt Masalas','PROCESSED','Rice Raw','Grilled Specials Raw','Chicken Kebabs Raw','Charges','MEAT','General','Raw Meat','MASALA PROCESSED','Staff Food') THEN 'Non-menu' ELSE ig.name END AS menu_category FROM `tabItem Group` ig), l AS (SELECT MAX(posting_date) AS last_day FROM `tabPOS Invoice` WHERE docstatus = 1 AND is_return = 0) SELECT pi.posting_date, DATEDIFF(MAX(l.last_day), pi.posting_date) AS days_ago, CASE WHEN pi.posting_date = MAX(l.last_day) THEN 'Latest day' ELSE 'Previous day' END AS day_label, pi.branch, pi.order_type, COALESCE(cm.menu_category, 'Unassigned') AS menu_category, CASE WHEN cm.menu_category IN ('Soft Drinks','Juices & Beverages') THEN 'Beverage' WHEN cm.menu_category IN ('Non-menu','Unassigned') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN 'Unassigned' ELSE 'Food' END AS category_family, pii.item_code, pii.item_name, SUM(pii.qty) AS qty, SUM(pii.net_amount) AS net_amount FROM `tabPOS Invoice Item` pii JOIN `tabPOS Invoice` pi ON pi.name = pii.parent AND pi.docstatus = 1 AND pi.is_return = 0 JOIN l ON pi.posting_date >= DATE_SUB(l.last_day, INTERVAL 93 DAY) LEFT JOIN cm ON cm.item_group = pii.item_group GROUP BY pi.posting_date, pi.branch, pi.order_type, COALESCE(cm.menu_category, 'Unassigned'), CASE WHEN cm.menu_category IN ('Soft Drinks','Juices & Beverages') THEN 'Beverage' WHEN cm.menu_category IN ('Non-menu','Unassigned') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN 'Unassigned' ELSE 'Food' END, pii.item_code, pii.item_name"
  # fact_items (sql): same rows, linked to the Date filter. Cards, category, dish and table charts.
  - id: fact_items
    title: "fact_items"
    sql: "WITH cm AS (SELECT ig.name AS item_group, CASE WHEN ig.name IN ('Dessert','Desserts','Pastry','Ice cream') THEN 'Desserts' WHEN ig.name IN ('Soups','Soups&Salads','SALADS','Salad Chicken') THEN 'Soups & Salads' WHEN ig.name IN ('Grills & BBQ','CHARCOL GRILLED','Grilled Specials','Chicken Al Fahams','KEBAB','Chicken Kebabs') THEN 'Grills & Kebabs' WHEN ig.name IN ('RICE','Biryani & Rice','Special Rice') THEN 'Rice & Biryani' WHEN ig.name IN ('Curries','GRAVY','GARAVIES','Main Course') THEN 'Mains & Curries' WHEN ig.name IN ('BURGER & WRAPS','Burgers & Sandwiches') THEN 'Burgers & Wraps' WHEN ig.name IN ('COMBOS','COMBO-LULU','PLATTER') THEN 'Combos & Platters' WHEN ig.name IN ('Soft Drinks','Cool Drinks','Soft Drink Spl','Soft Drink Can') THEN 'Soft Drinks' WHEN ig.name IN ('Juices&Mocktails','Smoothies','Beverages') THEN 'Juices & Beverages' WHEN ig.name = 'All Item Groups' THEN 'Unassigned' WHEN ig.name IN ('Raw Material','Services','Sub Assemblies','Consumable','Central Store','Burning Materials','Cleaning Material','Disposable','Chicken','Frozen Goods','Groceries','Milk & Curd','FISH','Provision','Sauces','Powder','Oil','Fruits','Kitchen Materials','Vegetable','VEGETABLES','Cleaning','Burning','GROCERY','Disposables','Ejt Masalas','PROCESSED','Rice Raw','Grilled Specials Raw','Chicken Kebabs Raw','Charges','MEAT','General','Raw Meat','MASALA PROCESSED','Staff Food') THEN 'Non-menu' ELSE ig.name END AS menu_category FROM `tabItem Group` ig), l AS (SELECT MAX(posting_date) AS last_day FROM `tabPOS Invoice` WHERE docstatus = 1 AND is_return = 0) SELECT pi.posting_date, DATEDIFF(MAX(l.last_day), pi.posting_date) AS days_ago, CASE WHEN pi.posting_date = MAX(l.last_day) THEN 'Latest day' ELSE 'Previous day' END AS day_label, pi.branch, pi.order_type, COALESCE(cm.menu_category, 'Unassigned') AS menu_category, CASE WHEN cm.menu_category IN ('Soft Drinks','Juices & Beverages') THEN 'Beverage' WHEN cm.menu_category IN ('Non-menu','Unassigned') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN 'Unassigned' ELSE 'Food' END AS category_family, pii.item_code, pii.item_name, SUM(pii.qty) AS qty, SUM(pii.net_amount) AS net_amount FROM `tabPOS Invoice Item` pii JOIN `tabPOS Invoice` pi ON pi.name = pii.parent AND pi.docstatus = 1 AND pi.is_return = 0 JOIN l ON pi.posting_date >= DATE_SUB(l.last_day, INTERVAL 93 DAY) LEFT JOIN cm ON cm.item_group = pii.item_group GROUP BY pi.posting_date, pi.branch, pi.order_type, COALESCE(cm.menu_category, 'Unassigned'), CASE WHEN cm.menu_category IN ('Soft Drinks','Juices & Beverages') THEN 'Beverage' WHEN cm.menu_category IN ('Non-menu','Unassigned') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN 'Unassigned' ELSE 'Food' END, pii.item_code, pii.item_name"

  - {id: fact_sales_lines_enriched, title: fact_sales_lines_enriched, sql: 'WITH cm AS (SELECT ig.name AS item_group, CASE WHEN ig.name IN (''Dessert'',''Desserts'',''Pastry'',''Ice cream'') THEN ''Desserts'' WHEN ig.name IN (''Soups'',''Soups&Salads'',''SALADS'',''Salad Chicken'') THEN ''Soups & Salads'' WHEN ig.name IN (''Grills & BBQ'',''CHARCOL GRILLED'',''Grilled Specials'',''Chicken Al Fahams'',''KEBAB'',''Chicken Kebabs'') THEN ''Grills & Kebabs'' WHEN ig.name IN (''RICE'',''Biryani & Rice'',''Special Rice'') THEN ''Rice & Biryani'' WHEN ig.name IN (''Curries'',''GRAVY'',''GARAVIES'',''Main Course'') THEN ''Mains & Curries'' WHEN ig.name IN (''BURGER & WRAPS'',''Burgers & Sandwiches'') THEN ''Burgers & Wraps'' WHEN ig.name IN (''COMBOS'',''COMBO-LULU'',''PLATTER'') THEN ''Combos & Platters'' WHEN ig.name IN (''Soft Drinks'',''Cool Drinks'',''Soft Drink Spl'',''Soft Drink Can'') THEN ''Soft Drinks'' WHEN ig.name IN (''Juices&Mocktails'',''Smoothies'',''Beverages'') THEN ''Juices & Beverages'' WHEN ig.name = ''All Item Groups'' THEN ''Unassigned'' WHEN ig.name IN (''Raw Material'',''Services'',''Sub Assemblies'',''Consumable'',''Central Store'',''Burning Materials'',''Cleaning Material'',''Disposable'',''Chicken'',''Frozen Goods'',''Groceries'',''Milk & Curd'',''FISH'',''Provision'',''Sauces'',''Powder'',''Oil'',''Fruits'',''Kitchen Materials'',''Vegetable'',''VEGETABLES'',''Cleaning'',''Burning'',''GROCERY'',''Disposables'',''Ejt Masalas'',''PROCESSED'',''Rice Raw'',''Grilled Specials Raw'',''Chicken Kebabs Raw'',''Charges'',''MEAT'',''General'',''Raw Meat'',''MASALA PROCESSED'',''Staff Food'') THEN ''Non-menu'' ELSE ig.name END AS menu_category FROM `tabItem Group` ig), bc AS (SELECT b.item, MAX(b.raw_material_cost / NULLIF(b.quantity, 0)) AS bom_unit_cost FROM `tabBOM` b WHERE b.is_default = 1 AND b.is_active = 1 AND b.docstatus = 1 AND b.raw_material_cost > 0 GROUP BY b.item) SELECT pii.name AS line_id, pi.name AS invoice, pi.posting_date, HOUR(pi.posting_time) AS hour_of_day, pi.branch, pi.company, pi.order_type, pi.waiter, pi.cashier, CASE WHEN pi.status = ''Consolidated'' THEN ''Consolidated'' ELSE ''Paid'' END AS population, pii.item_code, pii.item_name, pii.item_group, COALESCE(cm.menu_category, ''Unassigned'') AS menu_category, CASE WHEN cm.menu_category IN (''Soft Drinks'',''Juices & Beverages'') THEN ''Beverage'' WHEN cm.menu_category IN (''Non-menu'',''Unassigned'') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN ''Unassigned'' ELSE ''Food'' END AS category_family, COALESCE(NULLIF(ipc.department, ''''), ''Unmapped'') AS department, COALESCE(NULLIF(ipc.production_unit, ''''), ''Unmapped'') AS config_unit, ipc.production_policy, pii.warehouse, pii.qty, pii.amount AS gross_amount, pii.net_amount, bc.bom_unit_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN 0 ELSE 1 END AS cost_known, pii.qty * bc.bom_unit_cost AS est_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN NULL ELSE pii.net_amount END AS costed_net_amount, CASE WHEN bc.bom_unit_cost IS NULL THEN NULL ELSE pii.net_amount - pii.qty * bc.bom_unit_cost END AS est_margin FROM `tabPOS Invoice Item` pii JOIN `tabPOS Invoice` pi ON pi.name = pii.parent AND pi.docstatus = 1 AND pi.is_return = 0 LEFT JOIN cm ON cm.item_group = pii.item_group LEFT JOIN `tabURY Item Production Configuration` ipc ON ipc.item = pii.item_code AND ipc.branch = pi.branch AND ipc.active = 1 LEFT JOIN bc ON bc.item = pii.item_code'}
  - {id: dim_item, title: dim_item, sql: 'WITH cm AS (SELECT ig.name AS item_group, CASE WHEN ig.name IN (''Dessert'',''Desserts'',''Pastry'',''Ice cream'') THEN ''Desserts'' WHEN ig.name IN (''Soups'',''Soups&Salads'',''SALADS'',''Salad Chicken'') THEN ''Soups & Salads'' WHEN ig.name IN (''Grills & BBQ'',''CHARCOL GRILLED'',''Grilled Specials'',''Chicken Al Fahams'',''KEBAB'',''Chicken Kebabs'') THEN ''Grills & Kebabs'' WHEN ig.name IN (''RICE'',''Biryani & Rice'',''Special Rice'') THEN ''Rice & Biryani'' WHEN ig.name IN (''Curries'',''GRAVY'',''GARAVIES'',''Main Course'') THEN ''Mains & Curries'' WHEN ig.name IN (''BURGER & WRAPS'',''Burgers & Sandwiches'') THEN ''Burgers & Wraps'' WHEN ig.name IN (''COMBOS'',''COMBO-LULU'',''PLATTER'') THEN ''Combos & Platters'' WHEN ig.name IN (''Soft Drinks'',''Cool Drinks'',''Soft Drink Spl'',''Soft Drink Can'') THEN ''Soft Drinks'' WHEN ig.name IN (''Juices&Mocktails'',''Smoothies'',''Beverages'') THEN ''Juices & Beverages'' WHEN ig.name = ''All Item Groups'' THEN ''Unassigned'' WHEN ig.name IN (''Raw Material'',''Services'',''Sub Assemblies'',''Consumable'',''Central Store'',''Burning Materials'',''Cleaning Material'',''Disposable'',''Chicken'',''Frozen Goods'',''Groceries'',''Milk & Curd'',''FISH'',''Provision'',''Sauces'',''Powder'',''Oil'',''Fruits'',''Kitchen Materials'',''Vegetable'',''VEGETABLES'',''Cleaning'',''Burning'',''GROCERY'',''Disposables'',''Ejt Masalas'',''PROCESSED'',''Rice Raw'',''Grilled Specials Raw'',''Chicken Kebabs Raw'',''Charges'',''MEAT'',''General'',''Raw Meat'',''MASALA PROCESSED'',''Staff Food'') THEN ''Non-menu'' ELSE ig.name END AS menu_category FROM `tabItem Group` ig), bc AS (SELECT b.item, MAX(b.raw_material_cost / NULLIF(b.quantity, 0)) AS bom_unit_cost FROM `tabBOM` b WHERE b.is_default = 1 AND b.is_active = 1 AND b.docstatus = 1 AND b.raw_material_cost > 0 GROUP BY b.item), sold AS (SELECT DISTINCT pii.item_code FROM `tabPOS Invoice Item` pii WHERE pii.docstatus = 1) SELECT i.name AS item_code, i.item_name, i.item_group, COALESCE(cm.menu_category, ''Unassigned'') AS menu_category, CASE WHEN cm.menu_category IN (''Soft Drinks'',''Juices & Beverages'') THEN ''Beverage'' WHEN cm.menu_category IN (''Non-menu'',''Unassigned'') THEN cm.menu_category WHEN cm.menu_category IS NULL THEN ''Unassigned'' ELSE ''Food'' END AS category_family, ipc.branch, COALESCE(NULLIF(ipc.department, ''''), ''Unmapped'') AS department, COALESCE(NULLIF(ipc.production_unit, ''''), ''Unmapped'') AS config_unit, ipc.production_policy, ipc.controlled_by_sales_plan, i.is_stock_item, i.is_sales_item, i.disabled, CASE WHEN sold.item_code IS NULL THEN 0 ELSE 1 END AS is_sold, bc.bom_unit_cost, CASE WHEN bc.bom_unit_cost IS NULL THEN 0 ELSE 1 END AS has_recipe_cost, i.valuation_rate, i.custom_yield_tracked, i.custom_yield_percent FROM `tabItem` i LEFT JOIN cm ON cm.item_group = i.item_group LEFT JOIN (SELECT c.item, MIN(c.branch) AS branch, MAX(NULLIF(c.department, '''')) AS department, MAX(NULLIF(c.production_unit, '''')) AS production_unit, MAX(c.production_policy) AS production_policy, MAX(c.controlled_by_sales_plan) AS controlled_by_sales_plan FROM `tabURY Item Production Configuration` c WHERE c.active = 1 GROUP BY c.item) ipc ON ipc.item = i.name LEFT JOIN bc ON bc.item = i.name LEFT JOIN sold ON sold.item_code = i.name'}
  - id: db04_costed_lines
    title: db04_costed_lines
    source_query: fact_sales_lines_enriched
    filters:
    - {column: cost_known, op: '=', value: 1}
    mutate:
    - {as: line_margin_pct, type: Decimal, expr: est_margin / costed_net_amount}

charts:
  # ---- Key numbers: latest day with sales, % change vs the day before, trend line
  - {id: db04_net_sales_kpi, title: "Net sales", query: fact_items, type: Number, compare_previous: true,
     date: {column: posting_date},
     y: [{expr: "sum(net_amount).round(0)", as: "Net sales"}]}
  - {id: db04_items_sold_kpi, title: "Items sold", query: fact_items, type: Number, compare_previous: true,
     date: {column: posting_date},
     y: [{expr: "sum(qty).round(0)", as: "Items sold"}]}
  - {id: db04_dishes_kpi, title: "Dishes sold", query: fact_items, type: Number, compare_previous: true,
     date: {column: posting_date},
     y: [{column: item_code, agg: count_distinct, as: "Dishes sold"}]}
  - {id: db04_avg_price_kpi, title: "Average price per item", query: fact_items, type: Number, compare_previous: true,
     date: {column: posting_date},
     y: [{expr: "(sum(net_amount) / sum(qty)).round(0)", as: "Average price per item"}]}
  - {id: db04_unassigned, title: "Sales not in a menu category", query: fact_items, type: Number, compare_previous: true,
     date: {column: posting_date},
     filters: [{column: menu_category, op: "=", value: Unassigned}],
     y: [{expr: "sum(net_amount).round(0)", as: "Sales not in a menu category"}]}


  # ---- Latest day vs previous day: top dishes (not linked to Date)
  - {id: db04_2day, title: "Top dishes: latest day vs previous day", query: fact_card_items, type: Bar, limit: 20, stack: false,
     filters: [{column: days_ago, op: "<=", value: 1}, {column: category_family, op: "!=", value: Non-menu}],
     x: item_name, y: [{expr: "sum(net_amount).round(0)", as: "Sales"}], split_by: {column: day_label, max: 2},
     order: [{by: "Sales", dir: desc}]}

  # ---- Categories (follow Date)
  - {id: db04_cat_rev, title: "Sales by menu category", query: fact_items, type: Row, limit: 15,
     color: "#b5922a", stack: true,
     filters: [{column: menu_category, op: "!=", value: Non-menu}],
     x: menu_category, y: [{expr: "sum(net_amount).round(0)", as: "Sales"}], order: [{by: "Sales", dir: desc}]}
  - {id: db04_family, title: "Food and drinks share", query: fact_items, type: Donut, limit: 5,
     filters: [{column: category_family, op: "!=", value: Non-menu}, {column: category_family, op: "!=", value: Unassigned}],
     x: category_family, y: [{expr: "sum(net_amount).round(0)", as: "Sales"}], order: [{by: "Sales", dir: desc}]}

  # ---- Dishes (follow Date). Bottom excludes Non-menu, Unassigned, Accompaniments (add-ons) and zero-sale lines.
  - {id: db04_top, title: "Top 10 dishes by sales", query: fact_items, type: Row, limit: 10,
     color: "#ab1eb3", stack: true,
     filters: [{column: category_family, op: "!=", value: Non-menu}, {column: category_family, op: "!=", value: Unassigned}],
     x: item_name, y: [{expr: "sum(net_amount).round(0)", as: "Sales"}], order: [{by: "Sales", dir: desc}]}
  - {id: db04_bottom, title: "Bottom 10 dishes by sales", query: fact_items, type: Row, limit: 10,
     color: "#e11d48", stack: true,
     filters: [{column: category_family, op: "!=", value: Non-menu}, {column: category_family, op: "!=", value: Unassigned},
               {column: menu_category, op: "!=", value: Accompaniments}, {column: net_amount, op: ">", value: 0}],
     x: item_name, y: [{expr: "sum(net_amount).round(0)", as: "Sales"}], order: [{by: "Sales", dir: asc}]}
  - {id: db04_item_table, title: "Dish sales table", query: fact_items, type: Table, limit: 15,
     show_filter_row: true, compact_numbers: false,
     rows: [menu_category, item_name],
     y: [{expr: "sum(qty).round(0)", as: Qty}, {expr: "sum(net_amount).round(0)", as: Sales}], order: [{by: Sales, dir: desc}]}

  # ---- Margin (estimate) and non-selling items
  - {id: db04_menu_eng, title: "Margin per dish, costed dishes only (estimate)", query: db04_costed_lines, type: Table, limit: 15,
     filters: [{column: line_margin_pct, op: ">=", value: -1}],
     rows: [item_name],
     y: [{expr: "sum(qty).round(0)", as: Qty},
         {expr: "(sum(est_margin) / sum(qty)).round(0)", as: "Margin per unit"},
         {expr: "sum(est_margin) / sum(costed_net_amount)", as: "Margin (%)", format: percent}],
     order: [{by: Qty, dir: desc}]}
  - {id: db04_nonselling, title: "Items never sold", query: dim_item, type: Table, limit: 100,
     enable_color_scale: false, compact_numbers: false,
     filters: [{column: is_sales_item, op: "=", value: 1}, {column: is_sold, op: "=", value: 0},
               {column: disabled, op: "=", value: 0}, {column: category_family, op: "!=", value: Non-menu}],
     rows: [menu_category, item_name], y: [{column: item_code, agg: count, as: Items}]}

dashboards:
  - id: db04_menu_category
    title: "Menu and category"
    filters:
      - {id: f_date, label: Date, type: date, icon: calendar, default: {op: within, value: {span: "current day", anchor: "__LATEST_DAY__"}}, applies_to: {fact_items: posting_date, db04_costed_lines: posting_date}, layout: {x: 0, y: 2, w: 6, h: 1}}
      - {id: f_branch, label: Branch, type: string, icon: map-pin, applies_to: {fact_items: branch, fact_card_items: branch, db04_costed_lines: branch}, layout: {x: 6, y: 2, w: 5, h: 1}}
      - {id: f_category, label: Category, type: string, icon: tag, applies_to: {fact_items: menu_category, fact_card_items: menu_category, db04_costed_lines: menu_category}, layout: {x: 11, y: 2, w: 5, h: 1}}
      - {id: f_order_type, label: Service, type: string, icon: shopping-bag, applies_to: {fact_items: order_type, fact_card_items: order_type, db04_costed_lines: order_type}, layout: {x: 16, y: 2, w: 4, h: 1}}
    items:
      - {text: "<h2>Menu and category</h2><p>Which dishes and categories earn, and which to promote, reprice or drop. Opens on the latest day with sales. Use <b>Date</b> to pick another day or a range, or clear it for all dates. Branch, Category and Service apply to every report.</p>", x: 0, y: 0, w: 20, h: 2}
      - {text: "<h3>Key numbers</h3><p>Totals for the <b>Date</b> picked, with the % change against the period before. Also follows Branch, Category and Service.</p>", x: 0, y: 3, w: 20, h: 2}
      - {chart: db04_net_sales_kpi, x: 0, y: 5, w: 4, h: 4}
      - {chart: db04_items_sold_kpi, x: 4, y: 5, w: 4, h: 4}
      - {chart: db04_dishes_kpi, x: 8, y: 5, w: 4, h: 4}
      - {chart: db04_avg_price_kpi, x: 12, y: 5, w: 4, h: 4}
      - {chart: db04_unassigned, x: 16, y: 5, w: 4, h: 4}
      - {chart: db04_2day, x: 0, y: 9, w: 20, h: 10}
      - {text: "<h3>Categories</h3><p>Follows the Date filter. Items that are not in a menu category show as Unassigned; move them to a menu Item Group to rank them.</p>", x: 0, y: 19, w: 20, h: 2}
      - {chart: db04_cat_rev, x: 0, y: 21, w: 12, h: 10}
      - {chart: db04_family, x: 12, y: 21, w: 8, h: 10}
      - {text: "<h3>Dishes</h3><p>What sells best and worst.</p>", x: 0, y: 31, w: 20, h: 2}
      - {chart: db04_top, x: 0, y: 33, w: 10, h: 9}
      - {chart: db04_bottom, x: 10, y: 33, w: 10, h: 9}
      - {chart: db04_item_table, x: 0, y: 42, w: 20, h: 10}
      - {text: "<h3>Margin and items never sold</h3>", x: 0, y: 52, w: 20, h: 1}
      - {chart: db04_menu_eng, x: 0, y: 53, w: 10, h: 9}
      - {chart: db04_nonselling, x: 10, y: 53, w: 10, h: 9}
      - {text: "<p><b>Estimate:</b> margin uses recipe (BOM) cost and covers only costed dishes, a small part of sales today. Dishes costing more than their price are left out. Items never sold are sellable, enabled items with no sale on any bill.</p>", x: 0, y: 62, w: 20, h: 2}
