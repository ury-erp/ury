# DB03 Sales deep-dive (redesign, 2026-11-22). Audience: chairman, owner, finance, branch manager, anyone.
# One "Period" filter drives the page. Default = the LATEST AVAILABLE DAY only. Periods: Latest day, Last 7 days, Last 30 days,
# This month so far, any single day ("Day: YYYY-MM-DD") or month ("Month: YYYY-MM") of the last ~93 days.
# How: fact_sales lists every bill once per period it belongs to (period_label) with period_start (the date the period starts), so
# picking periods just filters period_label; with 2+ periods the charts draw one colour per period (cards then add them up). Clearing the Period filter double counts bills (a bill sits in several periods).
# Branch / Service / Waiter are global: they apply to every query. The two trend charts (last 14 days, monthly average) show
# history by design, so they follow Branch / Service / Waiter but not Period.
# time_of_day labels start with an invisible character (U+200B..U+2061, increasing) so they sort Breakfast..Late night without showing numbers.
# No currency symbols anywhere. Insights runs these queries on DuckDB: cast before LPAD, no TIME_TO_SEC etc.
workbook: {id: ury_db03_sales_deep_dive, title: "Sales deep-dive", module: "URY", required_apps: [ury]}
queries:
  - id: fact_sales
    title: "fact_sales"
    sql: "WITH l AS (SELECT MAX(posting_date) AS last_day FROM `tabPOS Invoice` WHERE docstatus = 1 AND is_return = 0), b AS (SELECT pi.name, pi.posting_date, HOUR(pi.posting_time) AS hour_of_day, LPAD(CAST(HOUR(pi.posting_time) AS CHAR), 2, '0') AS hour_label, CASE WHEN HOUR(pi.posting_time) < 11 THEN '​Breakfast (before 11 am)' WHEN HOUR(pi.posting_time) < 15 THEN '‌Lunch (11 am to 3 pm)' WHEN HOUR(pi.posting_time) < 19 THEN '‍Snacks (3 to 7 pm)' WHEN HOUR(pi.posting_time) < 23 THEN '⁠Dinner (7 to 11 pm)' ELSE '⁡Late night' END AS time_of_day, CASE WHEN HOUR(pi.posting_time) < 11 THEN 1 WHEN HOUR(pi.posting_time) < 15 THEN 2 WHEN HOUR(pi.posting_time) < 19 THEN 3 WHEN HOUR(pi.posting_time) < 23 THEN 4 ELSE 5 END AS tod_order, pi.branch, pi.order_type, pi.waiter, COALESCE(NULLIF(u.first_name, ''), pi.waiter) AS waiter_name, CASE WHEN pi.status = 'Consolidated' THEN 'Consolidated' ELSE 'Paid' END AS population, pi.net_total, pi.discount_amount, pi.total_qty, CASE WHEN CAST(pi.no_of_pax AS SIGNED) > 0 THEN CAST(pi.no_of_pax AS SIGNED) ELSE 0 END AS covers, CASE WHEN CAST(pi.no_of_pax AS SIGNED) > 0 THEN pi.net_total ELSE 0 END AS cover_sales, l.last_day, DATE_SUB(l.last_day, INTERVAL (DAYOFMONTH(l.last_day) - 1) DAY) AS m_start FROM `tabPOS Invoice` pi JOIN l ON pi.posting_date >= DATE_SUB(l.last_day, INTERVAL 93 DAY) LEFT JOIN `tabUser` u ON u.name = pi.waiter WHERE pi.docstatus = 1 AND pi.is_return = 0) SELECT name, posting_date, hour_of_day, hour_label, time_of_day, tod_order, branch, order_type, waiter, waiter_name, population, net_total, discount_amount, total_qty, covers, cover_sales, 'Latest day' AS period_label, last_day AS period_start FROM b WHERE posting_date = last_day UNION ALL SELECT name, posting_date, hour_of_day, hour_label, time_of_day, tod_order, branch, order_type, waiter, waiter_name, population, net_total, discount_amount, total_qty, covers, cover_sales, 'Last 7 days' AS period_label, DATE_SUB(last_day, INTERVAL 6 DAY) AS period_start FROM b WHERE posting_date >= DATE_SUB(last_day, INTERVAL 6 DAY) UNION ALL SELECT name, posting_date, hour_of_day, hour_label, time_of_day, tod_order, branch, order_type, waiter, waiter_name, population, net_total, discount_amount, total_qty, covers, cover_sales, 'Last 30 days' AS period_label, DATE_SUB(last_day, INTERVAL 29 DAY) AS period_start FROM b WHERE posting_date >= DATE_SUB(last_day, INTERVAL 29 DAY) UNION ALL SELECT name, posting_date, hour_of_day, hour_label, time_of_day, tod_order, branch, order_type, waiter, waiter_name, population, net_total, discount_amount, total_qty, covers, cover_sales, 'This month so far' AS period_label, m_start AS period_start FROM b WHERE posting_date >= m_start UNION ALL SELECT name, posting_date, hour_of_day, hour_label, time_of_day, tod_order, branch, order_type, waiter, waiter_name, population, net_total, discount_amount, total_qty, covers, cover_sales, CONCAT('Day: ', DATE_FORMAT(posting_date, '%Y-%m-%d')) AS period_label, posting_date AS period_start FROM b WHERE 1 = 1 UNION ALL SELECT name, posting_date, hour_of_day, hour_label, time_of_day, tod_order, branch, order_type, waiter, waiter_name, population, net_total, discount_amount, total_qty, covers, cover_sales, CONCAT('Month: ', DATE_FORMAT(posting_date, '%Y-%m')) AS period_label, CAST(DATE_FORMAT(posting_date, '%Y-%m-01') AS DATE) AS period_start FROM b WHERE 1 = 1"
  - id: fact_daily
    title: "fact_daily"
    sql: "WITH l AS (SELECT MAX(posting_date) AS last_day FROM `tabPOS Invoice` WHERE docstatus = 1 AND is_return = 0) SELECT pi.posting_date, DATE_FORMAT(pi.posting_date, '%Y-%m') AS month_label, DATEDIFF(l.last_day, pi.posting_date) AS days_ago, pi.branch, pi.order_type, pi.waiter, SUM(pi.net_total) AS net_sales, COUNT(*) AS bills FROM `tabPOS Invoice` pi JOIN l ON pi.posting_date >= DATE_SUB(l.last_day, INTERVAL 396 DAY) WHERE pi.docstatus = 1 AND pi.is_return = 0 GROUP BY pi.posting_date, DATE_FORMAT(pi.posting_date, '%Y-%m'), DATEDIFF(l.last_day, pi.posting_date), pi.branch, pi.order_type, pi.waiter"

  # fact_card_days (sql): one row per day x branch x service x waiter, listed once per period label so the Period filter works.
  # Cards use it: date column posting_date (day) gives "latest day in the period" with % change vs the day before and a trend line.
  # A period contributes its own days plus enough earlier days (14 min) for the comparison and sparkline.
  - id: fact_card_days
    title: "fact_card_days"
    sql: "WITH l AS (SELECT MAX(posting_date) AS last_day FROM `tabPOS Invoice` WHERE docstatus = 1 AND is_return = 0), b AS (SELECT pi.name, pi.posting_date, HOUR(pi.posting_time) AS hour_of_day, LPAD(CAST(HOUR(pi.posting_time) AS CHAR), 2, '0') AS hour_label, CASE WHEN HOUR(pi.posting_time) < 11 THEN '​Breakfast (before 11 am)' WHEN HOUR(pi.posting_time) < 15 THEN '‌Lunch (11 am to 3 pm)' WHEN HOUR(pi.posting_time) < 19 THEN '‍Snacks (3 to 7 pm)' WHEN HOUR(pi.posting_time) < 23 THEN '⁠Dinner (7 to 11 pm)' ELSE '⁡Late night' END AS time_of_day, CASE WHEN HOUR(pi.posting_time) < 11 THEN 1 WHEN HOUR(pi.posting_time) < 15 THEN 2 WHEN HOUR(pi.posting_time) < 19 THEN 3 WHEN HOUR(pi.posting_time) < 23 THEN 4 ELSE 5 END AS tod_order, pi.branch, pi.order_type, pi.waiter, COALESCE(NULLIF(u.first_name, ''), pi.waiter) AS waiter_name, CASE WHEN pi.status = 'Consolidated' THEN 'Consolidated' ELSE 'Paid' END AS population, pi.net_total, pi.discount_amount, pi.total_qty, CASE WHEN CAST(pi.no_of_pax AS SIGNED) > 0 THEN CAST(pi.no_of_pax AS SIGNED) ELSE 0 END AS covers, CASE WHEN CAST(pi.no_of_pax AS SIGNED) > 0 THEN pi.net_total ELSE 0 END AS cover_sales, l.last_day, DATE_SUB(l.last_day, INTERVAL (DAYOFMONTH(l.last_day) - 1) DAY) AS m_start FROM `tabPOS Invoice` pi JOIN l ON pi.posting_date >= DATE_SUB(l.last_day, INTERVAL 93 DAY) LEFT JOIN `tabUser` u ON u.name = pi.waiter WHERE pi.docstatus = 1 AND pi.is_return = 0), d AS (SELECT posting_date, branch, order_type, waiter, SUM(net_total) AS net_sales, COUNT(*) AS bills, SUM(total_qty) AS items, SUM(covers) AS covers, SUM(cover_sales) AS cover_sales, SUM(discount_amount) AS discounts, MAX(last_day) AS last_day, MAX(m_start) AS m_start FROM b GROUP BY posting_date, branch, order_type, waiter) SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, 'Latest day' AS period_label FROM d WHERE posting_date BETWEEN DATE_SUB(last_day, INTERVAL 13 DAY) AND last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, 'Last 7 days' AS period_label FROM d WHERE posting_date BETWEEN DATE_SUB(last_day, INTERVAL 13 DAY) AND last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, 'Last 30 days' AS period_label FROM d WHERE posting_date BETWEEN DATE_SUB(last_day, INTERVAL 29 DAY) AND last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, 'This month so far' AS period_label FROM d WHERE posting_date BETWEEN LEAST(m_start, DATE_SUB(last_day, INTERVAL 13 DAY)) AND last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Month: ', DATE_FORMAT(posting_date, '%Y-%m')) AS period_label FROM d WHERE 1 = 1 UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 0 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 0 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 1 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 1 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 2 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 2 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 3 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 3 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 4 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 4 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 5 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 5 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 6 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 6 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 7 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 7 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 8 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 8 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 9 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 9 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 10 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 10 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 11 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 11 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 12 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 12 DAY) <= last_day UNION ALL SELECT posting_date, branch, order_type, waiter, net_sales, bills, items, covers, cover_sales, discounts, CONCAT('Day: ', DATE_FORMAT(DATE_ADD(posting_date, INTERVAL 13 DAY), '%Y-%m-%d')) AS period_label FROM d WHERE DATE_ADD(posting_date, INTERVAL 13 DAY) <= last_day"
  # fact_hourly_2day (sql): bills of the latest data day and the day before it, for the latest vs previous day line chart.
  # Follows Branch / Service / Waiter; not Period (it always shows these two days).
  - id: fact_hourly_2day
    title: "fact_hourly_2day"
    sql: "WITH l AS (SELECT MAX(posting_date) AS last_day FROM `tabPOS Invoice` WHERE docstatus = 1 AND is_return = 0) SELECT pi.name, pi.posting_date, LPAD(CAST(HOUR(pi.posting_time) AS CHAR), 2, '0') AS hour_label, pi.branch, pi.order_type, pi.waiter, pi.net_total, CASE WHEN pi.posting_date = l.last_day THEN CONCAT('Latest day ', DATE_FORMAT(pi.posting_date, '%Y-%m-%d')) ELSE CONCAT('Previous day ', DATE_FORMAT(pi.posting_date, '%Y-%m-%d')) END AS day_text FROM `tabPOS Invoice` pi JOIN l ON pi.posting_date >= DATE_SUB(l.last_day, INTERVAL 1 DAY) WHERE pi.docstatus = 1 AND pi.is_return = 0"

charts:
  # ---- Key numbers (top). Each card = last day of the selected period, % change vs the day before, and a trend line.
  - {id: db03_day_sales, title: "Day sales", query: fact_card_days, type: Number, comparison: true, sparkline: true, shorten_numbers: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(net_sales).round(0)", as: "Day sales"}]}
  - {id: db03_bills, title: "Bills", query: fact_card_days, type: Number, comparison: true, sparkline: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(bills)", as: "Bills"}]}
  - {id: db03_avg_bill, title: "Average bill value", query: fact_card_days, type: Number, comparison: true, sparkline: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "(sum(net_sales) / sum(bills)).round(0)", as: "Average bill value"}]}
  - {id: db03_avg_size, title: "Average bill size (items per bill)", query: fact_card_days, type: Number, comparison: true, sparkline: true, decimal: 1,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(items) / sum(bills)", as: "Average bill size (items per bill)"}]}
  - {id: db03_avg_cover, title: "Average spend per guest", query: fact_card_days, type: Number, comparison: true, sparkline: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "(sum(cover_sales) / sum(covers)).round(0)", as: "Average spend per guest"}]}
  - {id: db03_guests, title: "Guests served", query: fact_card_days, type: Number, comparison: true, sparkline: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(covers)", as: "Guests served"}]}
  - {id: db03_items, title: "Items sold", query: fact_card_days, type: Number, comparison: true, sparkline: true, shorten_numbers: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(items)", as: "Items sold"}]}
  - {id: db03_discounts, title: "Discounts given", query: fact_card_days, type: Number, comparison: true, sparkline: true, negative_is_better: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(discounts).round(0)", as: "Discounts given"}]}
  - {id: db03_2day_line, title: "Latest day vs previous day: sales by hour", query: fact_hourly_2day, type: Line, limit: 100, smooth: true, show_area: true, show_data_points: true,
     x: hour_label, y: [{column: net_total, agg: sum, as: "Sales"}], split_by: {column: day_text, max: 2},
     order: [{by: hour_label, dir: asc}]}

  # ---- Compare the periods side by side
  - {id: db03_scorecard, title: "Period scorecard", query: fact_sales, type: Table, limit: 20,
     rows: [period_label],
     y: [{expr: "sum(net_total).round(0)", as: "Sales"}, {column: name, agg: count, as: Bills}, {expr: "(sum(net_total) / count(name)).round(0)", as: "Average bill value"}, {expr: "(sum(total_qty) / count(name)).round(1)", as: "Items per bill"}, {expr: "(sum(cover_sales) / sum(covers)).round(0)", as: "Spend per guest"}],
     order: [{by: period_label, dir: asc}]}
  - {id: db03_hourly, title: "When do we sell? Sales by hour", query: fact_sales, type: Line, limit: 100, smooth: true, show_area: true,
     x: hour_label, y: [{column: net_total, agg: sum, as: "Sales"}], split_by: {column: period_label, max: 6},
     order: [{by: hour_label, dir: asc}]}
  - {id: db03_timeofday, title: "Sales by time of day", query: fact_sales, type: Bar, limit: 20, stack: false,
     x: time_of_day, y: [{column: net_total, agg: sum, as: "Sales"}], split_by: {column: period_label, max: 6},
     order: [{by: time_of_day, dir: asc}]}

  # ---- Service-wise sales
  - {id: db03_service_compare, title: "Service-wise sales", query: fact_sales, type: Bar, limit: 30, stack: false,
     x: order_type, y: [{column: net_total, agg: sum, as: "Sales"}], split_by: {column: period_label, max: 6}}
  - {id: db03_service_share, title: "Share of sales by service", query: fact_sales, type: Donut, limit: 8,
     x: order_type, y: [{column: net_total, agg: sum, as: "Sales"}]}
  - {id: db03_service_avg, title: "Average bill value by service", query: fact_sales, type: Row, color: "#f59e0b", limit: 10,
     x: order_type, y: [{expr: "(sum(net_total) / count(name)).round(0)", as: "Average bill value"}],
     order: [{by: "Average bill value", dir: desc}]}
  - {id: db03_waiters, title: "Top waiters by sales", query: fact_sales, type: Row, color: "#10b981", limit: 10,
     filters: [{column: population, op: "=", value: "Paid"}],
     x: waiter_name, y: [{column: net_total, agg: sum, as: "Sales"}], order: [{by: "Sales", dir: desc}]}

  # ---- Trends (history; follow Branch / Service / Waiter, not Period)
  - {id: db03_daily, title: "Sales by day", query: fact_sales, type: Bar, limit: 100, color: "#6a39db", show_data_labels: true,
     x: {column: posting_date, granularity: day}, y: [{column: net_total, agg: sum, as: "Sales"}]}
  - {id: db03_monthly_avg, title: "Monthly average sales per day", query: fact_daily, type: Bar, limit: 14, color: "#0ea5e9", show_data_labels: true,
     x: month_label, y: [{expr: "(sum(net_sales) / distinct_count(posting_date)).round(0)", as: "Average sales per day"}]}
  - {id: db03_monthly_total, title: "Monthly total sales", query: fact_daily, type: Line, limit: 14, smooth: true, show_area: true, color: "#ec4899",
     x: month_label, y: [{column: net_sales, agg: sum, as: "Total sales"}]}

  # ---- Detail
  - {id: db03_grid, title: "Bills by hour", query: fact_sales, type: Table, enable_color_scale: true, limit: 50,
     rows: [hour_label], columns: [period_label], y: [{column: name, agg: count, as: Bills}],
     order: [{by: hour_label, dir: asc}]}

dashboards:
  - id: sales_deep_dive
    title: "Sales deep-dive"
    filters:
      - {id: f_period, label: "Period", type: string, icon: calendar, default: {op: "=", value: "Latest day"}, applies_to: {fact_sales: period_label, fact_card_days: period_label}, layout: {x: 0, y: 2, w: 8, h: 1}}
      - {id: f_branch, label: Branch, type: string, icon: store, applies_to: {fact_sales: branch, fact_daily: branch, fact_card_days: branch, fact_hourly_2day: branch}, layout: {x: 8, y: 2, w: 4, h: 1}}
      - {id: f_service, label: Service, type: string, icon: utensils, applies_to: {fact_sales: order_type, fact_daily: order_type, fact_card_days: order_type, fact_hourly_2day: order_type}, layout: {x: 12, y: 2, w: 4, h: 1}}
      - {id: f_waiter, label: Waiter, type: string, icon: user, applies_to: {fact_sales: waiter, fact_daily: waiter, fact_card_days: waiter, fact_hourly_2day: waiter}, layout: {x: 16, y: 2, w: 4, h: 1}}
