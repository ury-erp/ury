      - {text: "<h3>Day and month trends</h3><p>Sales by day follows the Period filter. The two monthly charts always show every month, so they follow Branch, Service and Waiter only.</p>", x: 0, y: 47, w: 20, h: 2}
      - {chart: db03_daily, x: 0, y: 49, w: 20, h: 8}
