      - {chart: db03_service_compare, x: 0, y: 38, w: 10, h: 9}
      - {chart: db03_service_share, x: 10, y: 38, w: 5, h: 9}
      - {chart: db03_service_avg, x: 15, y: 38, w: 5, h: 9}
      - {text: "<h3>Day and month trends</h3><p>Sales by day follows the Date filter. The two monthly charts always show every month, so they follow Branch, Service and Waiter only.</p>", x: 0, y: 47, w: 20, h: 2}
