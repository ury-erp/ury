# DB02 Branch daily, DAILY view (redesign 2026-11-23). Audience: the branch manager.
# Same pattern as DB01 / DB03: ONE Date filter (`within`, default {span: current day, anchor: latest day with sales}; the importer fills the
# __LATEST_DAY__ anchor and refresh_latest_day_defaults moves it nightly). Clear it for all dates (last 93 days), or pick a range.
# Number cards do NOT follow Date: each shows the latest day its source has records for, the % change vs the day before and a trend line,
# and follows Branch / Service. Charts follow Date, Branch, Service.
# Guests / spend per guest count Dine In bills paid by waiters with a guest count (as before). No currency symbols. Insights runs these queries on DuckDB.
workbook: {id: ury_db02_branch_daily, title: "URY Branch Daily", module: "URY", required_apps: [ury]}
queries:
  # fact_card_days (sql): one row per day x branch x service x bill type (last 93 days before the latest sales day). Cards. Not linked to Date.
  - id: fact_card_days
    title: "fact_card_days"
    sql: "WITH l AS (SELECT MAX(posting_date) AS last_day FROM `tabPOS Invoice` WHERE docstatus = 1 AND is_return = 0), b AS (SELECT pi.posting_date, LPAD(CAST(HOUR(pi.posting_time) AS CHAR), 2, '0') AS hour_label, pi.branch, pi.order_type, CASE WHEN pi.status = 'Consolidated' THEN 'Consolidated' ELSE 'Paid' END AS population, pi.net_total, pi.discount_amount, CASE WHEN pi.order_type = 'Dine In' AND pi.status <> 'Consolidated' AND CAST(pi.no_of_pax AS SIGNED) > 0 THEN CAST(pi.no_of_pax AS SIGNED) ELSE 0 END AS covers, CASE WHEN pi.order_type = 'Dine In' AND pi.status <> 'Consolidated' AND CAST(pi.no_of_pax AS SIGNED) > 0 THEN pi.net_total ELSE 0 END AS cover_sales, l.last_day FROM `tabPOS Invoice` pi JOIN l ON pi.posting_date >= DATE_SUB(l.last_day, INTERVAL 93 DAY) WHERE pi.docstatus = 1 AND pi.is_return = 0) SELECT posting_date, DATEDIFF(MAX(last_day), posting_date) AS days_ago, branch, order_type, population, SUM(net_total) AS net_sales, COUNT(*) AS bills, SUM(covers) AS covers, SUM(cover_sales) AS cover_sales FROM b GROUP BY posting_date, branch, order_type, population"
  # fact_sales (sql): one row per day x hour x branch x service x bill type, linked to Date. Charts by hour / service.
  - id: fact_sales
    title: "fact_sales"
    sql: "WITH l AS (SELECT MAX(posting_date) AS last_day FROM `tabPOS Invoice` WHERE docstatus = 1 AND is_return = 0), b AS (SELECT pi.posting_date, LPAD(CAST(HOUR(pi.posting_time) AS CHAR), 2, '0') AS hour_label, pi.branch, pi.order_type, CASE WHEN pi.status = 'Consolidated' THEN 'Consolidated' ELSE 'Paid' END AS population, pi.net_total, pi.discount_amount, CASE WHEN pi.order_type = 'Dine In' AND pi.status <> 'Consolidated' AND CAST(pi.no_of_pax AS SIGNED) > 0 THEN CAST(pi.no_of_pax AS SIGNED) ELSE 0 END AS covers, CASE WHEN pi.order_type = 'Dine In' AND pi.status <> 'Consolidated' AND CAST(pi.no_of_pax AS SIGNED) > 0 THEN pi.net_total ELSE 0 END AS cover_sales, l.last_day FROM `tabPOS Invoice` pi JOIN l ON pi.posting_date >= DATE_SUB(l.last_day, INTERVAL 93 DAY) WHERE pi.docstatus = 1 AND pi.is_return = 0) SELECT posting_date, hour_label, branch, order_type, population, SUM(net_total) AS net_sales, COUNT(*) AS bills FROM b GROUP BY posting_date, hour_label, branch, order_type, population"

  - id: fact_kot_headers
    title: fact_kot_headers
    table: URY KOT
    joins:
    - table: POS Profile
      type: left
      true: [pos_profile, name]
      columns: [custom_kot_warning_time, table_attention_time]
    filters:
    - {column: docstatus, op: '=', value: 1}
    mutate:
    - {as: prod_minutes, type: Decimal, expr: production_time.cast("float64")}
    - {as: hour_of_day, type: Integer, expr: hour(time)}
    - {as: is_served, type: Integer, expr: 'if_else(order_status == ''Served'', 1, 0)'}
    - {as: sla_breach, type: Integer, expr: 'if_else(production_time.cast("float64") > custom_kot_warning_time, 1, 0)'}
    select: [name, date, hour_of_day, branch, production, type, order_status, is_served, invoice, restaurant_table, pos_profile, user, prod_minutes, custom_kot_warning_time, sla_breach]
  # same as fact_kot_headers, linked to Date (the prep-time-by-hour chart); the cards use fact_kot_headers, which Date does not touch
  - id: fact_kot_by_hour
    title: fact_kot_by_hour
    table: URY KOT
    joins:
    - table: POS Profile
      type: left
      true: [pos_profile, name]
      columns: [custom_kot_warning_time, table_attention_time]
    filters:
    - {column: docstatus, op: '=', value: 1}
    mutate:
    - {as: prod_minutes, type: Decimal, expr: production_time.cast("float64")}
    - {as: hour_of_day, type: Integer, expr: hour(time)}
    - {as: is_served, type: Integer, expr: 'if_else(order_status == ''Served'', 1, 0)'}
    - {as: sla_breach, type: Integer, expr: 'if_else(production_time.cast("float64") > custom_kot_warning_time, 1, 0)'}
    select: [name, date, hour_of_day, branch, production, type, order_status, is_served, invoice, restaurant_table, pos_profile, user, prod_minutes, custom_kot_warning_time, sla_breach]
  - id: dim_table
    title: dim_table
    table: URY Table
    select: [name, branch, restaurant, restaurant_room, no_of_seats, minimum_seating, is_take_away, occupied, latest_invoice_time]
  - id: fact_cancellations
    title: fact_cancellations
    table: POS Invoice
    filters:
    - {column: docstatus, op: '=', value: 2}
    select: [name, posting_date, branch, company, order_type, waiter, cashier, status, grand_total, cancel_reason, restaurant_table]
  - id: fact_yield_checks
    title: fact_yield_checks
    table: URY Yield Check
    joins:
    - table: Item
      type: left
      true: [item, name]
      columns: [item_name, item_group]
    mutate:
    - {as: expected_output, type: Decimal, expr: input_qty * standard_yield_percent_snapshot / 100}
    - {as: yield_loss_qty, type: Decimal, expr: input_qty * standard_yield_percent_snapshot / 100 - output_qty}
    - {as: below_standard, type: Integer, expr: 'if_else(variance_percent < 0, 1, 0)'}
    - {as: out_of_tolerance, type: Integer, expr: 'if_else(variance_percent < -5, 1, 0)'}
    select: [name, checked_on, branch, company, department, production_unit, item, item_name, item_group, stock_uom, check_type, checked_by, input_qty, output_qty, expected_output, yield_loss_qty, actual_yield_percent, standard_yield_percent_snapshot, variance_percent, below_standard, out_of_tolerance]

charts:
  # ---- Key numbers: latest day with data, % change vs the day before, trend line
  - {id: db02_net_sales, title: "Net sales", query: fact_card_days, type: Number, comparison: true, sparkline: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(net_sales).round(0)", as: "Net sales"}]}
  - {id: db02_bills, title: "Bills", query: fact_card_days, type: Number, comparison: true, sparkline: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(bills)", as: "Bills"}]}
  - {id: db02_covers, title: "Guests served (dine in)", query: fact_card_days, type: Number, comparison: true, sparkline: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(covers)", as: "Guests served (dine in)"}]}
  - {id: db02_spend_per_cover, title: "Spend per guest (dine in)", query: fact_card_days, type: Number, comparison: true, sparkline: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "(sum(cover_sales) / sum(covers)).round(0)", as: "Spend per guest (dine in)"}]}
  - {id: db02_kot_kpi, title: "Kitchen orders", query: fact_kot_headers, type: Number, comparison: true, sparkline: true,
     date: {column: date, granularity: day}, y: [{expr: "count(name)", as: "Kitchen orders"}]}
  - {id: db02_kot_unserved, title: "Kitchen orders not yet served", query: fact_kot_headers, type: Number, comparison: true, sparkline: true, negative_is_better: true,
     date: {column: date, granularity: day}, y: [{expr: "count(name) - sum(is_served)", as: "Kitchen orders not yet served"}]}
  - {id: db02_kot_prep, title: "Average prep time (min)", query: fact_kot_headers, type: Number, comparison: true, sparkline: true, negative_is_better: true,
     date: {column: date, granularity: day}, y: [{expr: "avg(prod_minutes).round(1)", as: "Average prep time (min)"}]}
  - {id: db02_sla, title: "Kitchen orders late (%)", query: fact_kot_headers, type: Number, comparison: true, sparkline: true, negative_is_better: true,
     date: {column: date, granularity: day}, y: [{expr: "sum(sla_breach) / sum(is_served)", as: "Kitchen orders late (%)", format: percent}]}

  # ---- Shape of the day (follow Date)
  - {id: db02_by_hour, title: "Sales by hour", query: fact_sales, type: Bar, limit: 30, color: "#594dd6", stack: true,
     x: hour_label, y: [{expr: "sum(net_sales).round(0)", as: "Sales"}], order: [{by: hour_label, dir: asc}]}
  - {id: db02_service, title: "Sales by service", query: fact_sales, type: Donut, limit: 5,
     x: order_type, y: [{expr: "sum(net_sales).round(0)", as: "Sales"}], order: [{by: "Sales", dir: desc}]}
  - {id: db02_prep_hour, title: "Kitchen prep time by hour (min)", query: fact_kot_by_hour, type: Bar, limit: 30, color: "#f59e0b",
     filters: [{column: order_status, op: "=", value: "Served"}],
     x: hour_of_day, y: [{column: prod_minutes, agg: avg, as: "Average prep time (min)"}], order: [{by: hour_of_day, dir: asc}]}
  # ---- Floor and leakage
  - {id: db02_occupied, title: "Tables occupied now", query: dim_table, type: Number, sparkline: false,
     y: [{column: occupied, agg: sum, as: Occupied}],
     filters: [{column: is_take_away, op: "=", value: 0}]}
  - {id: db02_tables, title: "Tables in total", query: dim_table, type: Number, sparkline: false,
     y: [{column: name, agg: count, as: Tables}],
     filters: [{column: is_take_away, op: "=", value: 0}]}
  - {id: db02_cancel_count, title: "Cancelled bills", query: fact_cancellations, type: Number, comparison: true, sparkline: true, negative_is_better: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "count(name)", as: "Cancelled bills"}]}
  - {id: db02_cancel, title: "Cancelled bills value", query: fact_cancellations, type: Number, comparison: true, sparkline: true, negative_is_better: true,
     date: {column: posting_date, granularity: day}, y: [{expr: "sum(grand_total).round(0)", as: "Cancelled bills value"}]}
  - {id: db02_oos_cancel, title: "Out-of-stock cancels", query: fact_cancellations, type: Number, comparison: true, sparkline: true, negative_is_better: true,
     date: {column: posting_date, granularity: day},
     filters: [{column: cancel_reason, op: "=", value: "Kitchen out of stock"}],
     y: [{column: name, agg: count, as: "Out-of-stock cancels"}]}
  - {id: db02_yield_checks, title: "Yield checks done", query: fact_yield_checks, type: Number, comparison: true, sparkline: true,
     date: {column: checked_on, granularity: day, data_type: Datetime},
     y: [{column: name, agg: count, as: "Yield checks done"}]}
  - {id: db02_yield_alert, title: "Yield checks failed", query: fact_yield_checks, type: Number, comparison: true, sparkline: true, negative_is_better: true,
     date: {column: checked_on, granularity: day, data_type: Datetime},
     y: [{column: out_of_tolerance, agg: sum, as: "Yield checks failed"}]}

dashboards:
  - id: branch_daily
    title: "Branch daily"
    filters:
      - {id: f_date, label: Date, type: date, icon: calendar, default: {op: within, value: {span: "current day", anchor: "__LATEST_DAY__"}}, layout: {x: 0, y: 2, w: 8, h: 1},
         applies_to: {fact_sales: posting_date, fact_kot_by_hour: date}}
      - {id: f_branch, label: Branch, type: string, icon: store, layout: {x: 8, y: 2, w: 6, h: 1},
         applies_to: {fact_card_days: branch, fact_sales: branch, fact_cancellations: branch, fact_kot_headers: branch, fact_kot_by_hour: branch, fact_yield_checks: branch, dim_table: branch}}
      - {id: f_order_type, label: Service, type: string, icon: utensils, layout: {x: 14, y: 2, w: 6, h: 1},
         applies_to: {fact_card_days: order_type, fact_sales: order_type, fact_cancellations: order_type}}
    items:
      - {text: "<h2>Branch daily</h2><p>How did the last trading day go: sales, guests, kitchen speed, cancellations and tables. Opens on the latest day with sales. Use <b>Date</b> to pick another day or a range, or clear it for all dates.</p>", x: 0, y: 0, w: 20, h: 2}
      - {text: "<h3>Key numbers</h3><p>Each card shows the latest day with records, the % change against the day before, and a trend line. Cards follow Branch and Service, not Date.</p>", x: 0, y: 3, w: 20, h: 2}
      - {chart: db02_net_sales, x: 0, y: 5, w: 5, h: 4}
      - {chart: db02_bills, x: 5, y: 5, w: 5, h: 4}
      - {chart: db02_covers, x: 10, y: 5, w: 5, h: 4}
      - {chart: db02_spend_per_cover, x: 15, y: 5, w: 5, h: 4}
      - {chart: db02_kot_kpi, x: 0, y: 9, w: 5, h: 4}
      - {chart: db02_kot_unserved, x: 5, y: 9, w: 5, h: 4}
      - {chart: db02_kot_prep, x: 10, y: 9, w: 5, h: 4}
      - {chart: db02_sla, x: 15, y: 9, w: 5, h: 4}
      - {text: "<p>Kitchen target is the KOT warning time on the POS profile (10 min, 15 for slow items).</p>", x: 0, y: 13, w: 20, h: 1}
      - {text: "<h3>Shape of the day</h3><p>Follows the Date filter.</p>", x: 0, y: 14, w: 20, h: 2}
      - {chart: db02_by_hour, x: 0, y: 16, w: 12, h: 9}
      - {chart: db02_service, x: 12, y: 16, w: 8, h: 9}
      - {chart: db02_prep_hour, x: 0, y: 25, w: 20, h: 9}
      - {text: "<h3>Floor and leakage</h3>", x: 0, y: 34, w: 20, h: 1}
      - {chart: db02_occupied, x: 0, y: 35, w: 5, h: 4}
      - {chart: db02_tables, x: 5, y: 35, w: 5, h: 4}
      - {chart: db02_cancel_count, x: 10, y: 35, w: 5, h: 4}
      - {chart: db02_cancel, x: 15, y: 35, w: 5, h: 4}
      - {chart: db02_yield_checks, x: 0, y: 39, w: 5, h: 4}
      - {chart: db02_yield_alert, x: 5, y: 39, w: 5, h: 4}
      - {chart: db02_oos_cancel, x: 10, y: 39, w: 5, h: 4}
      - {text: "<p>Yield checks failed = checks more than 5 points under the recipe standard. Tables occupied is live, not for a day.</p>", x: 0, y: 43, w: 20, h: 1}
