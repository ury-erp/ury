      - {chart: db17_channel_donut, x: 14, y: 22, w: 6, h: 8}
      - {chart: db17_branch_collection, x: 0, y: 30, w: 10, h: 10}
      - {chart: db17_branch_repeat, x: 10, y: 30, w: 10, h: 10}
