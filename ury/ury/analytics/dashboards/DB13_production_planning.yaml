# DB13 Production planning (plan vs actual). Workbook ury_db13_production_planning. Builder: BUILD-DB13.
# Base queries copied verbatim from semantic_layer.yaml (fact_sales_plan_items, fact_cancellations).
# Never row-join plan x sales (architecture rule 2): section S4 shows two charts side by side under the same filters.
# Layout: portfolio coordinates shifted +1 on y because the 3 filters occupy row y=0.
# Redesign 2026-11-24 (pattern of DB01-DB06): ONE Date filter (`within`, default {span: current day, anchor: latest day with sales}; the importer fills the
# __LATEST_DAY__ anchor and refresh_latest_day_defaults moves it nightly), cleared = all dates, or pick a range. Number cards use compare_previous: total for
# the dates picked, % change vs the previous period for a `within` Date, trend line for week-or-longer periods; a `between` range or cleared Date shows the total only.
# Live cards (a snapshot with no date) show the current value only. No currency symbols; charts use distinct colours.
workbook: {id: ury_db13_production_planning, title: "URY Production Planning", module: "URY", required_apps: [ury]}
queries:
  # fact_sales_plan_items (builder, T1). Grain: one URY Sales Plan Item of a submitted plan (Locked for Production).
  # Attainment = SUM(fulfilled_qty)/SUM(qty). under/over split per line BEFORE aggregation. Date column: plan_date.
  - id: fact_sales_plan_items
    title: "fact_sales_plan_items"
    table: "URY Sales Plan Item"
    joins:
      - {table: "URY Sales Plan", type: inner, on: [parent, name], columns: [plan_date, branch, company, status, service_period, enforcement_mode]}
    filters:
      - {column: docstatus, op: "=", value: 1}
    mutate:
      - {as: under_qty, type: Decimal, expr: "if_else(qty > fulfilled_qty, qty - fulfilled_qty, 0)"}
      - {as: over_qty, type: Decimal, expr: "if_else(fulfilled_qty > qty, fulfilled_qty - qty, 0)"}
    select: [name, parent, plan_date, branch, company, status, service_period, enforcement_mode, item_code, department, production_unit, production_policy, stock_uom, qty, committed_qty, fulfilled_qty, under_qty, over_qty]

  # fact_cancellations (builder, T1). Grain: one cancelled POS Invoice (docstatus = 2). Value lost = SUM(grand_total).
  # The waiter is the order owner, NOT necessarily the person who cancelled (canceller not stored).
  - id: fact_cancellations
    title: "fact_cancellations"
    table: "POS Invoice"
    filters:
      - {column: docstatus, op: "=", value: 2}
    mutate:
      - {as: population, type: String, expr: "if_else(status == 'Consolidated', 'Consolidated', 'Paid')"}
    select: [name, posting_date, branch, company, order_type, waiter, cashier, population, grand_total, cancel_reason, restaurant_table]

  # fact_bulk_production (builder, T4 on demo: 0 rows). Grain: one submitted Bulk Production run. total_cost = cost of the batch.
  - id: fact_bulk_production
    title: "fact_bulk_production"
    table: "Bulk Production"
    filters:
      - {column: docstatus, op: "=", value: 1}
    select: [name, posting_date, branch, company, warehouse, total_cost, status]

  # ---------------------------------------------------------------- SALES
  # fact_sales_lines (sql, T1, the canonical revenue line). Grain: one submitted POS Invoice Item.
  # Revenue = SUM(net_amount). Header measures (covers, grand_total) must NOT be summed here (line fan-out).
  # department = CONFIGURED department (URY Item Production Configuration, active row of the SAME branch: joined on item AND
  # branch, because a menu item has one config row per branch and an item-only join repeated every sale once per branch).
  # Why sql: the builder join takes one equality pair, this join needs item, branch and active.
  # Date column: posting_date.
  - id: fact_sales_lines
    title: "fact_sales_lines"
    sql: "SELECT `tabPOS Invoice Item`.`name` AS `name`, `tabPOS Invoice Item`.`parent` AS `parent`, `tabPOS Invoice`.`posting_date` AS `posting_date`, HOUR(`tabPOS Invoice`.`posting_time`) AS `hour_of_day`, `tabPOS Invoice`.`branch` AS `branch`, `tabPOS Invoice`.`company` AS `company`, `tabPOS Invoice`.`order_type` AS `order_type`, `tabPOS Invoice`.`waiter` AS `waiter`, `tabPOS Invoice`.`cashier` AS `cashier`, IF(`tabPOS Invoice`.`status` = 'Consolidated', 'Consolidated', 'Paid') AS `population`, `tabPOS Invoice`.`pos_profile` AS `pos_profile`, `tabPOS Invoice`.`restaurant_table` AS `restaurant_table`, `tabPOS Invoice Item`.`item_code` AS `item_code`, `tabPOS Invoice Item`.`item_name` AS `item_name`, `tabPOS Invoice Item`.`item_group` AS `item_group`, `tabURY Item Production Configuration`.`department` AS `department`, `tabURY Item Production Configuration`.`production_unit` AS `production_unit`, `tabURY Item Production Configuration`.`production_policy` AS `production_policy`, `tabPOS Invoice Item`.`warehouse` AS `warehouse`, `tabPOS Invoice Item`.`qty` AS `qty`, `tabPOS Invoice Item`.`amount` AS `amount`, `tabPOS Invoice Item`.`net_amount` AS `net_amount`, `tabPOS Invoice Item`.`discount_amount` AS `discount_amount`, `tabPOS Invoice Item`.`price_list_rate` AS `price_list_rate` FROM `tabPOS Invoice Item` INNER JOIN `tabPOS Invoice` ON `tabPOS Invoice`.`name` = `tabPOS Invoice Item`.`parent` LEFT JOIN `tabURY Item Production Configuration` ON `tabURY Item Production Configuration`.`item` = `tabPOS Invoice Item`.`item_code` AND `tabURY Item Production Configuration`.`branch` = `tabPOS Invoice`.`branch` AND `tabURY Item Production Configuration`.`active` = 1 WHERE `tabPOS Invoice Item`.`docstatus` = 1 AND `tabPOS Invoice`.`is_return` = 0"

charts:
  # S1 KPIs (T1). No `date` on the Number charts -> TOTAL of the filtered rows.
  # PLN-001 Plan fulfilled, PLN-002 Planned quantity
  - {id: db13_kpi, title: "Plan fulfilled (%)", query: fact_sales_plan_items, type: Number, compare_previous: true, date: {column: plan_date}, y: [{expr: "sum(fulfilled_qty) / sum(qty)", as: "Plan fulfilled (%)", format: percent}]}
  - {id: db13_planned_kpi, title: "Planned qty", query: fact_sales_plan_items, type: Number, compare_previous: true, date: {column: plan_date}, y: [{column: qty, agg: sum, as: "Planned qty"}]}
  - {id: db13_made_kpi, title: "Made qty", query: fact_sales_plan_items, type: Number, compare_previous: true, date: {column: plan_date}, y: [{column: fulfilled_qty, agg: sum, as: "Made qty"}]}
  # LKG-007 Out-of-stock cancellations
  - {id: db13_oos, title: "Bills cancelled: kitchen out of stock", query: fact_cancellations, type: Number, compare_previous: true, negative_is_better: true, date: {column: posting_date}, filters: [{column: cancel_reason, op: "=", value: "Kitchen out of stock"}], y: [{column: name, agg: count, as: "Bills cancelled"}]}

  # S2 Misses (T1). under_qty / over_qty are split per line before aggregation.
  # PLN-004 Under-production
  - {id: db13_under, title: "Made less than planned, by dish (qty)", query: fact_sales_plan_items, type: Row, limit: 15, x: item_code, y: [{column: under_qty, agg: sum, as: "Short by (qty)", color: "#6a39db"}], order: [{by: "Short by (qty)", dir: desc}]}
  # PLN-005 Over-production
  - {id: db13_over, title: "Made more than planned, by dish (qty)", query: fact_sales_plan_items, type: Row, limit: 15, filters: [{column: over_qty, op: ">", value: 0}], x: item_code, y: [{column: over_qty, agg: sum, as: "Extra (qty)", color: "#f59e0b"}], order: [{by: "Extra (qty)", dir: desc}]}

  # S3 Shape (T1). Ratio of sums, never average of ratios.
  - {id: db13_dept, title: "Plan fulfilled by department (%)", query: fact_sales_plan_items, type: Row, x: department, y: [{expr: "(100 * sum(fulfilled_qty) / sum(qty)).round(1)", as: "Plan fulfilled (%)", color: "#10b981"}], order: [{by: "Plan fulfilled (%)", dir: desc}]}
  # PLN-008 Attainment by service period and enforcement
  - {id: db13_period, title: "Plan fulfilled by service period and enforcement (%)", query: fact_sales_plan_items, type: Bar, stack: false, x: service_period, split_by: {column: enforcement_mode}, y: [{expr: "(100 * sum(fulfilled_qty) / sum(qty)).round(1)", as: "Plan fulfilled (%)"}]}
  - {id: db13_trend, title: "Plan fulfilled by day (%)", query: fact_sales_plan_items, type: Line, color: "#e11d48", limit: 366, x: {column: plan_date, granularity: day}, y: [{expr: "(100 * sum(fulfilled_qty) / sum(qty)).round(1)", as: "Plan fulfilled (%)"}]}

  # S4 lowest-fulfilled dishes (replaces planned/sold unit charts). Ratio of sums.
  - {id: db13_dish_low, title: "Plan fulfilled by dish, lowest 15 (%)", query: fact_sales_plan_items, type: Row, limit: 15, filters: [{column: qty, op: ">", value: 0}], x: item_code, y: [{expr: "(100 * sum(fulfilled_qty) / sum(qty)).round(1)", as: "Plan fulfilled (%)", color: "#0ea5e9"}], order: [{by: "Plan fulfilled (%)", dir: asc}]}
  # PLN-009 Committed vs fulfilled (committed quantity stays empty until reservations are used)
  - {id: db13_committed, title: "Committed vs made by service period (qty)", query: fact_sales_plan_items, type: Bar, limit: 10,
     x: service_period, y: [{column: committed_qty, agg: sum, as: "Committed (qty)", color: "#ec4899"}, {column: fulfilled_qty, agg: sum, as: "Made (qty)", color: "#84cc16"}]}
  # PLN-010 Plan vs POS units sold (two charts side by side on the same date filter; never row-joined)
  - {id: db13_planned_dish, title: "Planned by dish, top 10 (qty)", query: fact_sales_plan_items, type: Row, limit: 10,
     x: item_code, y: [{column: qty, agg: sum, as: "Planned (qty)", color: "#f97316"}], order: [{by: "Planned (qty)", dir: desc}]}
  - {id: db13_sold_dish, title: "Sold by dish, top 10 (qty)", query: fact_sales_lines, type: Row, limit: 10,
     x: item_code, y: [{column: qty, agg: sum, as: "Sold (qty)", color: "#14b8a6"}], order: [{by: "Sold (qty)", dir: desc}]}
  # PRD-008 Bulk production cost
  - {id: db13_bulk_cost, title: "Bulk production cost", query: fact_bulk_production, type: Number, compare_previous: true, date: {column: posting_date},
     y: [{expr: "(sum(total_cost)).round(0)", as: "Bulk cost"}]}

dashboards:
  - id: production_planning
    title: "Production planning"
    filters:
      - {id: f_date, label: Date, type: date, icon: calendar, default: {op: within, value: {span: "current day", anchor: "__LATEST_DAY__"}}, layout: {x: 0, y: 2, w: 7, h: 1}, applies_to: {fact_sales_plan_items: plan_date, fact_cancellations: posting_date, fact_sales_lines: posting_date, fact_bulk_production: posting_date}}
      - {id: f_branch, label: Branch, type: string, icon: store, layout: {x: 7, y: 2, w: 7, h: 1}, applies_to: {fact_sales_plan_items: branch, fact_cancellations: branch, fact_sales_lines: branch, fact_bulk_production: branch}}
      - {id: f_department, label: Department, type: string, icon: layers, layout: {x: 14, y: 2, w: 6, h: 1}, applies_to: {fact_sales_plan_items: department, fact_sales_lines: department}}
    items:
      - {text: "<h2>Production planning</h2><p>Did each station make what the sales plan asked for, and which dishes fell short? For the kitchen head. Good is near 100% with few out-of-stock cancellations. Opens on the latest day with sales. Use <b>Date</b> to pick another day or a range, or clear it for all dates.</p>", x: 0, y: 0, w: 20, h: 2}
      - {text: "<h3>Key numbers</h3><p>Totals for the <b>Date</b> picked, with the % change against the period before. Also follows Branch and Department where they apply.</p>", x: 0, y: 3, w: 20, h: 2}
      - {chart: db13_bulk_cost, x: 0, y: 5, w: 4, h: 4}
      - {chart: db13_kpi, x: 4, y: 5, w: 4, h: 4}
      - {chart: db13_planned_kpi, x: 8, y: 5, w: 4, h: 4}
      - {chart: db13_made_kpi, x: 12, y: 5, w: 4, h: 4}
      - {chart: db13_oos, x: 16, y: 5, w: 4, h: 4}
      - {chart: db13_under, x: 0, y: 9, w: 10, h: 12}
      - {chart: db13_over, x: 10, y: 9, w: 10, h: 12}
      - {chart: db13_dish_low, x: 0, y: 21, w: 10, h: 12}
      - {chart: db13_dept, x: 10, y: 21, w: 10, h: 12}
      - {chart: db13_period, x: 0, y: 33, w: 10, h: 12}
      - {chart: db13_trend, x: 10, y: 33, w: 10, h: 12}
      - {chart: db13_committed, x: 0, y: 45, w: 10, h: 12}
      - {chart: db13_planned_dish, x: 10, y: 45, w: 10, h: 12}
      - {chart: db13_sold_dish, x: 0, y: 57, w: 20, h: 11}
      - {text: "<p>Plan vs sales: the two dish charts use the same filters but are not joined. Bulk production cost is the total of submitted bulk runs in the period.</p>", x: 0, y: 68, w: 20, h: 2}
      - {text: "<p>100% = made exactly what the plan asked for.</p>", x: 0, y: 70, w: 20, h: 1}
      - {text: "<p>Plan fulfilled = quantity made divided by quantity planned.</p>", x: 0, y: 71, w: 20, h: 2}
