<!doctype html>
<html lang="en-IN" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="brief-user" content="{{ brief_user_key }}">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>URY Brief</title>
<link rel="manifest" href="/assets/ury/brief/manifest.webmanifest">
<link rel="apple-touch-icon" href="/assets/ury/brief/icons/apple-touch-icon.png">
<style>
:root{
  --bg:#f7f4ef;--card:#ffffff;--ink:#1c1917;--muted:#57534e;--line:#e7e2da;
  --good:#166534;--good-bg:#dcfce7;--bad:#991b1b;--bad-bg:#fee2e2;--neu:#44403c;--neu-bg:#e7e5e4;
  --accent:#b45309;--btn:#1c1917;--btn-ink:#ffffff;
  --c1:#2563eb;--c2:#d97706;--c3:#059669;--c4:#9333ea;--c5:#64748b;
  --spark:#2563eb;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#14110f;--card:#1f1b18;--ink:#f5f5f4;--muted:#b5aea8;--line:#33302c;
    --good:#86efac;--good-bg:#14532d;--bad:#fca5a5;--bad-bg:#7f1d1d;--neu:#e7e5e4;--neu-bg:#44403c;
    --accent:#fbbf24;--btn:#f5f5f4;--btn-ink:#1c1917;
    --c1:#60a5fa;--c2:#fbbf24;--c3:#34d399;--c4:#c084fc;--c5:#94a3b8;
    --spark:#60a5fa;
  }
}
*{box-sizing:border-box}
html{font-size:20px}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.4;-webkit-text-size-adjust:100%}
a{color:var(--accent)}
.app{display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
header.bar{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.5rem 1rem;min-height:48px}
header.bar h1{margin:0;font-size:.9rem;font-weight:650;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.banner{margin:0 1rem;padding:.5rem .75rem;border-radius:.6rem;background:var(--neu-bg);color:var(--neu);font-size:.8rem}
.banner[hidden]{display:none}
.banner button{min-height:44px;min-width:44px;margin-left:.5rem;font:inherit;color:inherit;background:transparent;border:1px solid currentColor;border-radius:.5rem;cursor:pointer}
.deck{flex:1;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scroll-behavior:smooth;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;scroll-snap-stop:always;overflow-y:auto;padding:.5rem 1rem 1rem}
.card{max-width:46rem;margin:0 auto;min-height:100%;background:var(--card);border:1px solid var(--line);border-radius:1.25rem;padding:1.25rem;display:flex;flex-direction:column;gap:1rem}
.card .title{margin:0;font-size:.8rem;font-weight:650;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.card h2{margin:0;font-size:1.6rem;line-height:1.2;font-weight:700}
.value{font-size:3.4rem;line-height:1;font-weight:750;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.row{display:flex;flex-wrap:wrap;align-items:center;gap:.75rem}
.chip{display:inline-flex;align-items:center;gap:.3rem;min-height:44px;padding:0 .9rem;border-radius:999px;font-weight:700;font-size:.9rem}
.chip.good{background:var(--good-bg);color:var(--good)}
.chip.bad{background:var(--bad-bg);color:var(--bad)}
.chip.neutral{background:var(--neu-bg);color:var(--neu)}
.sub{font-size:.85rem;color:var(--muted)}
.chart{display:flex;justify-content:center}
.chart svg{max-width:100%;height:auto}
.spark-wrap{width:100%}
.spark-wrap svg{width:100%;height:9rem}
.legend{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.legend li{display:grid;grid-template-columns:auto 1fr auto auto;align-items:center;gap:.6rem;min-height:44px;border-top:1px solid var(--line);font-size:.9rem}
.legend li:first-child{border-top:0}
.sw{width:.8rem;height:.8rem;border-radius:.2rem}
.pct{font-variant-numeric:tabular-nums;color:var(--muted)}
.amt{font-variant-numeric:tabular-nums;font-weight:650;text-align:right;min-width:4.5rem}
.dq{font-size:.8rem;color:var(--accent)}
.drill{display:inline-flex;align-items:center;min-height:44px;font-weight:650}
.nav{display:flex;align-items:center;justify-content:center;gap:.75rem;padding:.5rem 1rem 1rem}
.nav button{min-width:44px;min-height:44px;border:0;border-radius:999px;font:inherit;font-size:1.1rem;font-weight:700;color:var(--btn-ink);background:var(--btn);cursor:pointer}
.nav button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:.25rem}
.dot{width:44px;height:44px;border:0;background:transparent;padding:0;cursor:pointer;display:grid;place-items:center}
.dot::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--line);border:1px solid var(--muted)}
.dot[aria-current="true"]::before{background:var(--ink);border-color:var(--ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.state{margin:auto;max-width:26rem;padding:2rem 1rem;text-align:center}
.state a.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 1.2rem;border-radius:.6rem;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:650}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skel{height:3rem;border-radius:.6rem;background:var(--line);margin:1rem}
@media (min-width:900px){
  .card{padding:2rem}
  .card h2{font-size:2.2rem}
  .value{font-size:4.2rem}
}
@media (prefers-reduced-motion:reduce){
  .deck{scroll-behavior:auto}
  *{transition:none!important;animation:none!important}
}
</style>
</head>
<body>
<div class="app" id="app" data-sample-url="/assets/ury/brief/brief.sample.json" data-api="/api/method/ury.ury.api.chairman.get_brief" data-login="/login?redirect-to=/ury/brief/">
  <header class="bar">
    <h1>URY Brief</h1>
    <button type="button" id="signout" style="min-height:44px;min-width:44px;font:inherit;border-radius:.5rem;border:1px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer">Sign out</button>
    <button type="button" id="install" hidden style="min-height:44px;min-width:44px;font:inherit;border-radius:.5rem;border:1px solid var(--muted);background:transparent;color:var(--ink);cursor:pointer">Add to home screen</button>
  </header>
  <p class="banner" id="banner" role="status" hidden></p>
  <p class="banner" id="update" role="status" hidden>New version available.<button type="button" id="update-btn">Reload</button></p>
  <main class="deck" id="deck" tabindex="-1" aria-label="Chairman brief slides">
    <noscript><div class="state"><h2>JavaScript is required</h2><p>The URY Brief needs JavaScript enabled to show your daily slides.</p></div></noscript>
    <div class="skel" aria-hidden="true"></div>
  </main>
  <nav class="nav" id="nav" aria-label="Slide navigation" hidden>
    <button type="button" id="prev" aria-label="Previous slide">&#8592;</button>
    <div class="dots" id="dots"></div>
    <button type="button" id="next" aria-label="Next slide">&#8594;</button>
  </nav>
  <div class="sr" id="live" aria-live="polite" aria-atomic="true"></div>
</div>
<script>
(function () {
  "use strict";
  var app = document.getElementById("app");
  var API = app.getAttribute("data-api");
  var SAMPLE = app.getAttribute("data-sample-url");
  var LOGIN = app.getAttribute("data-login");
  var deck = document.getElementById("deck");
  var nav = document.getElementById("nav");
  var dotsEl = document.getElementById("dots");
  var prevBtn = document.getElementById("prev");
  var nextBtn = document.getElementById("next");
  var live = document.getElementById("live");
  var banner = document.getElementById("banner");
  var USER_KEY_STORE = "ury-brief-user";
  var NS = "http://www.w3.org/2000/svg";
  var COLORS = ["var(--c1)", "var(--c2)", "var(--c3)", "var(--c4)", "var(--c5)"];
  var slideCount = 0;
  var current = 0;

  /* en-IN compact currency, mirrors server rules */
  function compactInr(n) {
    var neg = n < 0;
    var a = Math.abs(Number(n) || 0);
    var s;
    function one(x, suffix) {
      var t = (Math.round(x * 10) / 10).toFixed(1);
      if (t.slice(-2) === ".0") { t = t.slice(0, -2); }
      return t + suffix;
    }
    if (a >= 1e7) { s = one(a / 1e7, "Cr"); }
    else if (a >= 1e5) { s = one(a / 1e5, "L"); }
    else if (a >= 1e3) { s = one(a / 1e3, "K"); }
    else { s = String(Math.round(a)); }
    return (neg ? "-" : "") + "\u20b9" + s;
  }
  window.__briefCompactInr = compactInr;

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) { e.className = cls; }
    if (text != null) { e.textContent = text; }
    return e;
  }
  function svg(tag, attrs) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) { if (Object.prototype.hasOwnProperty.call(attrs, k)) { e.setAttribute(k, attrs[k]); } }
    return e;
  }

  function sparkline(series) {
    var w = 300, h = 100, pad = 8;
    var wrap = el("div", "spark-wrap");
    var s = svg("svg", { viewBox: "0 0 " + w + " " + h, preserveAspectRatio: "none", role: "img", "aria-label": "Sales for the last " + series.length + " days" });
    var vals = series.map(function (p) { return Number(p.value) || 0; });
    var min = Math.min.apply(null, vals), max = Math.max.apply(null, vals);
    var span = max - min || 1;
    var pts = vals.map(function (v, i) {
      var x = series.length > 1 ? pad + (i * (w - 2 * pad)) / (series.length - 1) : w / 2;
      var y = h - pad - ((v - min) / span) * (h - 2 * pad);
      return [x, y];
    });
    s.appendChild(svg("polyline", { points: pts.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" "), fill: "none", stroke: "var(--spark)", "stroke-width": "3", "stroke-linejoin": "round", "stroke-linecap": "round", "vector-effect": "non-scaling-stroke" }));
    var last = pts[pts.length - 1];
    if (last) { s.appendChild(svg("circle", { cx: last[0], cy: last[1], r: "5", fill: "var(--spark)" })); }
    wrap.appendChild(s);
    return wrap;
  }

  function donut(series) {
    var total = series.reduce(function (a, p) { return a + (Number(p.value) || 0); }, 0);
    var r = 40, c = 2 * Math.PI * r, off = 0;
    var s = svg("svg", { viewBox: "0 0 120 120", width: "220", height: "220", role: "img", "aria-label": "Share by category" });
    s.appendChild(svg("circle", { cx: "60", cy: "60", r: r, fill: "none", stroke: "var(--line)", "stroke-width": "18" }));
    if (total > 0) {
      series.forEach(function (p, i) {
        var len = ((Number(p.value) || 0) / total) * c;
        var seg = svg("circle", { cx: "60", cy: "60", r: r, fill: "none", stroke: COLORS[i % COLORS.length], "stroke-width": "18", "stroke-dasharray": len.toFixed(2) + " " + (c - len).toFixed(2), "stroke-dashoffset": (-off).toFixed(2), transform: "rotate(-90 60 60)" });
        s.appendChild(seg);
        off += len;
      });
    }
    var wrap = el("div", "chart");
    wrap.appendChild(s);
    return { node: wrap, total: total };
  }

  function legend(series, total) {
    var ul = el("ul", "legend");
    series.forEach(function (p, i) {
      var li = el("li");
      var sw = el("span", "sw"); sw.style.background = COLORS[i % COLORS.length]; sw.setAttribute("aria-hidden", "true");
      li.appendChild(sw);
      li.appendChild(el("span", "", p.label));
      li.appendChild(el("span", "pct", (total > 0 ? Math.round(((Number(p.value) || 0) / total) * 100) : 0) + "%"));
      li.appendChild(el("span", "amt", compactInr(p.value)));
      ul.appendChild(li);
    });
    return ul;
  }

  function deltaChip(slide) {
    var d = slide.delta_pct;
    var tone = slide.tone || "neutral";
    if (d == null) { return null; }
    // Server owns the rounding (delta_label) so the chip always agrees with the headline.
    var label = slide.delta_label != null ? String(slide.delta_label) : (Math.abs(Math.round(d * 1000) / 10) + "%");
    var arrow = d > 0.0005 ? "\u25B2" : d < -0.0005 ? "\u25BC" : "\u25AC";
    var sign = d > 0.0005 ? "+" : d < -0.0005 ? "-" : "";
    var chip = el("span", "chip " + tone, arrow + " " + sign + label);
    chip.setAttribute("aria-label", (d >= 0 ? "Up " : "Down ") + label + " versus comparison period");
    return chip;
  }

  function renderSlide(slide, idx, total) {
    var sec = el("section", "slide");
    sec.setAttribute("aria-roledescription", "slide");
    sec.setAttribute("aria-label", (idx + 1) + " of " + total + ": " + slide.title);
    sec.setAttribute("data-slide-id", slide.id);
    var card = el("div", "card");
    card.appendChild(el("p", "title", slide.title));
    card.appendChild(el("h2", "", slide.headline));
    var chart = slide.chart || { type: "", series: [] };
    var series = chart.series || [];
    if (slide.id === "yesterday" || chart.type === "spark") {
      if (slide.value != null) { card.appendChild(el("div", "value", compactInr(slide.value))); }
      var row = el("div", "row");
      var chip = deltaChip(slide);
      if (chip) { row.appendChild(chip); }
      if (slide.orders != null) {
        var t = slide.orders + " orders";
        if (slide.orders_compare != null) { t += " vs " + slide.orders_compare; }
        row.appendChild(el("span", "sub", t));
      }
      card.appendChild(row);
      if (series.length) { card.appendChild(sparkline(series)); card.appendChild(el("p", "sub", "Last " + series.length + " days")); }
    } else if (chart.type === "donut") {
      var d = donut(series);
      card.appendChild(d.node);
      card.appendChild(legend(series, d.total));
      if (slide.value != null) { card.appendChild(el("p", "sub", "Total " + compactInr(slide.value))); }
    } else {
      return null; /* unknown slide type: ignore */
    }
    if (slide.data_quality === "partial") { card.appendChild(el("p", "dq", "Partial data: some days or values are missing.")); }
    if (slide.drill) {
      var a = el("a", "drill", "Open dashboard \u2192");
      a.href = slide.drill;
      card.appendChild(a);
    }
    sec.appendChild(card);
    return sec;
  }

  function showState(title, msg, linkHref, linkText) {
    deck.textContent = "";
    nav.hidden = true;
    var box = el("div", "state");
    box.appendChild(el("h2", "", title));
    box.appendChild(el("p", "sub", msg));
    if (linkHref) { var a = el("a", "btn", linkText); a.href = linkHref; box.appendChild(a); }
    else {
      var b = el("button", "chip neutral", "Try again");
      b.type = "button"; b.style.border = "0"; b.style.cursor = "pointer";
      b.addEventListener("click", function () { location.reload(); });
      box.appendChild(b);
    }
    deck.appendChild(box);
  }

  function fmtTime(iso) {
    var m = /T(\d\d:\d\d)/.exec(iso || "");
    return m ? m[1] : "";
  }

  function setBanner(text) {
    if (text) { banner.textContent = text; banner.hidden = false; } else { banner.hidden = true; }
  }

  function goTo(i) {
    if (i < 0 || i >= slideCount) { return; }
    var w = deck.clientWidth;
    deck.scrollTo({ left: (document.dir === "rtl" ? -1 : 1) * i * w });
  }

  function updateNav() {
    var w = deck.clientWidth || 1;
    var i = Math.round(Math.abs(deck.scrollLeft) / w);
    i = Math.max(0, Math.min(slideCount - 1, i));
    var changed = i !== current;
    current = i;
    prevBtn.disabled = i === 0;
    nextBtn.disabled = i >= slideCount - 1;
    var dots = dotsEl.children;
    for (var k = 0; k < dots.length; k++) {
      if (k === i) { dots[k].setAttribute("aria-current", "true"); } else { dots[k].removeAttribute("aria-current"); }
    }
    if (changed) {
      var s = deck.children[i];
      live.textContent = s ? s.getAttribute("aria-label") : "";
    }
  }

  function render(brief, fromCache) {
    deck.textContent = "";
    dotsEl.textContent = "";
    var slides = (brief && brief.slides) || [];
    var nodes = [];
    slides.forEach(function (s, i) {
      var n = renderSlide(s, i, slides.length);
      if (n) { nodes.push(n); }
    });
    if (!nodes.length) { showState("No brief yet", "There is nothing to show for this date."); return; }
    nodes.forEach(function (n) { deck.appendChild(n); });
    slideCount = nodes.length;
    current = 0;
    nodes.forEach(function (n, i) {
      var d = el("button", "dot");
      d.type = "button";
      d.setAttribute("aria-label", "Go to slide " + (i + 1));
      d.addEventListener("click", function () { goTo(i); });
      dotsEl.appendChild(d);
    });
    nav.hidden = false;
    if (brief.date) { document.title = "URY Brief - " + brief.date; }
    if (fromCache) { setBanner("Showing " + fmtTime(brief.as_of) + " brief, offline"); } else { setBanner(""); }
    updateNav();
  }

  prevBtn.addEventListener("click", function () { goTo(current - 1); });
  nextBtn.addEventListener("click", function () { goTo(current + 1); });
  deck.addEventListener("scroll", function () { window.requestAnimationFrame(updateNav); }, { passive: true });
  document.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { goTo(current - 1); }
    else if (e.key === "ArrowRight") { goTo(current + 1); }
  });

  /* ---- identity / cache isolation ---- */
  function swPost(msg) {
    try {
      if ("serviceWorker" in navigator) {
        var c = navigator.serviceWorker.controller;
        if (c) { c.postMessage(msg); }
      }
    } catch (e) {}
  }
  function wipeCaches() {
    try {
      if (window.caches) {
        return caches.keys().then(function (keys) {
          return Promise.all(keys.filter(function (k) { return k.indexOf("ury-brief-") === 0; }).map(function (k) { return caches.delete(k); }));
        }).catch(function () {});
      }
    } catch (e) {}
    return Promise.resolve();
  }
  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }

  function showSignIn() {
    lsDel(USER_KEY_STORE);
    setBanner("");
    slideCount = 0;
    dotsEl.textContent = "";
    showState("Please sign in", "Your session has ended or you do not have access to the brief.", LOGIN, "Sign in");
  }

  function checkUser() {
    var meta = document.querySelector('meta[name="brief-user"]');
    var key = meta ? meta.getAttribute("content") : "";
    var prev = lsGet(USER_KEY_STORE);
    if (key && prev !== key) {
      /* different (or first-seen) user: drop any cached data before rendering */
      swPost({ type: "LOGOUT" });
      return wipeCaches().then(function () { lsSet(USER_KEY_STORE, key); });
    }
    return Promise.resolve();
  }

  document.getElementById("signout").addEventListener("click", function () {
    var done = false;
    function finish() {
      if (done) { return; }
      done = true;
      swPost({ type: "LOGOUT" });
      wipeCaches().then(function () {
        lsDel(USER_KEY_STORE);
        location.href = "/login";
      });
    }
    try {
      fetch("/api/method/logout", { method: "POST", credentials: "same-origin" }).then(finish, finish);
    } catch (e) { finish(); }
  });

  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.addEventListener("message", function (e) {
      if (e.data && e.data.type === "AUTH_LOST") { showSignIn(); }
    });
  }

  /* load: no date param unless the URL has one, so the server picks its default day */
  var params = new URLSearchParams(location.search);
  var url;
  if (params.get("sample") === "1") { url = SAMPLE; }
  else {
    url = API;
    if (params.get("date")) { url += "?date=" + encodeURIComponent(params.get("date")); }
  }
  var isSample = params.get("sample") === "1";

  checkUser().then(function () {
    return fetch(url, { credentials: "same-origin", headers: { "Accept": "application/json" } });
  })
    .then(function (res) {
      if (res.status === 401 || res.status === 403) {
        showSignIn();
        return null;
      }
      var fromCache = res.headers.get("X-Brief-Source") === "cache";
      if (res.status === 503) {
        return res.json().then(function (j) {
          if (j && j.offline) {
            showState("You are offline", "No saved brief is available yet. Connect once to load it.");
            setBanner("Offline");
            return null;
          }
          throw new Error("HTTP 503");
        });
      }
      if (!res.ok) { throw new Error("HTTP " + res.status); }
      return res.json().then(function (j) {
        var brief = isSample ? j : j.message;
        render(brief, fromCache && !isSample);
        return null;
      });
    })
    .catch(function () {
      showState("Brief unavailable", "Could not load the brief. Check your connection and try again.");
    });

  /* service worker + install + update */
  var installBtn = document.getElementById("install");
  var deferred = null;
  window.addEventListener("beforeinstallprompt", function (e) { e.preventDefault(); deferred = e; installBtn.hidden = false; });
  installBtn.addEventListener("click", function () {
    if (!deferred) { return; }
    deferred.prompt();
    deferred = null;
    installBtn.hidden = true;
  });
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("/ury/brief/sw.js", { scope: "/ury/brief/" }).then(function (reg) {
      var updateBar = document.getElementById("update");
      function offer(w) {
        updateBar.hidden = false;
        document.getElementById("update-btn").onclick = function () { w.postMessage({ type: "SKIP_WAITING" }); };
      }
      if (reg.waiting && navigator.serviceWorker.controller) { offer(reg.waiting); }
      reg.addEventListener("updatefound", function () {
        var w = reg.installing;
        if (!w) { return; }
        w.addEventListener("statechange", function () {
          if (w.state === "installed" && navigator.serviceWorker.controller) { offer(w); }
        });
