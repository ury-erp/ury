<!doctype html>
<html lang="{{ lang|e }}" dir="{{ dir|e }}">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="robots" content="noindex, nofollow">
	<title>{{ _("Not available") }}</title>
	<style>
		@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 400; font-display: swap; src: url("/assets/ury/fonts/ibm-plex-sans-arabic-400-arabic.woff2") format("woff2"); unicode-range: U+0600-06FF, U+FB50-FDFF, U+FE70-FEFC; }
		@font-face { font-family: "IBM Plex Sans Arabic"; font-weight: 600; font-display: swap; src: url("/assets/ury/fonts/ibm-plex-sans-arabic-600-arabic.woff2") format("woff2"); unicode-range: U+0600-06FF, U+FB50-FDFF, U+FE70-FEFC; }
		body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: "IBM Plex Sans Arabic", system-ui, sans-serif; color: #0f172a; background: radial-gradient(800px 400px at 50% -10%, #fdecea, transparent 60%), #f6f7fb; }
		.box { max-width: 440px; text-align: center; background: #fff; border: 1px solid #e2e8f0; border-radius: 18px; padding: 36px 28px; box-shadow: 0 20px 40px -24px rgba(15,23,42,.25); }
		.icon { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 16px; display: grid; place-items: center; background: #fdecea; color: #e5392f; }
		h1 { margin: 0 0 8px; font-size: 22px; }
		p { margin: 0 0 22px; color: #475569; line-height: 1.8; font-size: 14px; }
		a { display: inline-block; padding: 12px 22px; border-radius: 12px; background: #e5392f; color: #fff; text-decoration: none; font-weight: 600; }
		a:focus-visible { outline: 3px solid rgba(229,57,47,.35); outline-offset: 2px; }
	</style>
</head>
<body>
	<main class="box">
		<div class="icon" aria-hidden="true">
			<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.9" y1="4.9" x2="19.1" y2="19.1"/></svg>
		</div>
		<h1>{{ _("This page is not available") }}</h1>
		<p>{% if feature %}{{ _("{0} is switched off for this restaurant. Ask an administrator if you need it.").format(feature|e) }}{% else %}{{ _("This feature is switched off for this restaurant.") }}{% endif %}</p>
		<a href="{{ home|e }}">{{ _("Go back") }}</a>
	</main>
</body>
</html>
