<svg xmlns="http://www.w3.org/2000/svg" width="420" height="300" viewBox="0 0 420 300" fill="none">
  <defs>
    <linearGradient id="ivory" x1="120" y1="150" x2="300" y2="260" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffefb"/><stop offset=".55" stop-color="#f8f4ec"/><stop offset="1" stop-color="#e3d6c6"/>
    </linearGradient>
    <linearGradient id="platformSide" x1="80" y1="232" x2="330" y2="290" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f1e1ce"/><stop offset=".53" stop-color="#e1cdb7"/><stop offset="1" stop-color="#cab69e"/>
    </linearGradient>
    <linearGradient id="platformTop" x1="90" y1="205" x2="320" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf6"/><stop offset="1" stop-color="#efe5d7"/>
    </linearGradient>
    <linearGradient id="rail" x1="60" y1="40" x2="360" y2="56" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e9c9b3"/><stop offset=".5" stop-color="#f6e3d3"/><stop offset="1" stop-color="#d4a88c"/>
    </linearGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="44" y2="46" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fba98b"/><stop offset=".45" stop-color="#dc7355"/><stop offset="1" stop-color="#ad482f"/>
    </linearGradient>
    <linearGradient id="panBody" x1="150" y1="200" x2="270" y2="246" gradientUnits="userSpaceOnUse">
      <stop stop-color="#e98c69"/><stop offset=".5" stop-color="#cf6a4b"/><stop offset="1" stop-color="#a5452e"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d5e1c3"/><stop offset=".5" stop-color="#a0b38d"/><stop offset="1" stop-color="#748e68"/>
    </linearGradient>
    <linearGradient id="honey" x1="0" y1="0" x2="34" y2="36" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe6ae"/><stop offset=".5" stop-color="#f2be62"/><stop offset="1" stop-color="#d4953b"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="70" y2="96" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffefb"/><stop offset="1" stop-color="#f1e9dd"/>
    </linearGradient>
    <radialGradient id="sageOrb" cx=".28" cy=".2" r=".87">
      <stop stop-color="#edf2da"/><stop offset=".45" stop-color="#b7c7a5"/><stop offset="1" stop-color="#708a65"/>
    </radialGradient>
    <radialGradient id="sauce" cx=".4" cy=".35" r=".8">
      <stop stop-color="#f7dcb5"/><stop offset="1" stop-color="#e3b886"/>
    </radialGradient>
    <filter id="groundShadow" x="-40%" y="-100%" width="180%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
    <filter id="softShadow" x="-35%" y="-30%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="9" flood-color="#836b52" flood-opacity=".15"/>
    </filter>
    <filter id="floatShadow" x="-40%" y="-30%" width="190%" height="190%" color-interpolation-filters="sRGB">
      <feDropShadow dx="2" dy="9" stdDeviation="7" flood-color="#916c50" flood-opacity=".14"/>
    </filter>
    <filter id="smallShadow" x="-40%" y="-40%" width="180%" height="200%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#876046" flood-opacity=".18"/>
    </filter>
  </defs>

  <ellipse cx="210" cy="168" rx="178" ry="110" transform="rotate(-10 210 168)" stroke="#dbc8b1" stroke-opacity=".45" stroke-dasharray="3 9"/>
  <circle cx="40" cy="168" r="3.5" fill="#d2b99b"/>
  <circle cx="384" cy="150" r="3" fill="#b3be9d"/>
  <path d="M374 214v10m-5-5h10M44 92v9m-4.5-4.5h9" stroke="#c8ad8e" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Ticket rail over the pass. -->
  <g filter="url(#softShadow)">
    <rect x="62" y="38" width="296" height="14" rx="7" fill="#c99a7c"/>
    <rect x="62" y="35" width="296" height="14" rx="7" fill="url(#rail)" stroke="#fbeee3"/>
  </g>

  <!-- New ticket: clay tag. -->
  <g transform="translate(92 46) rotate(-6)" filter="url(#floatShadow)">
    <rect x="22" y="-6" width="20" height="10" rx="3" fill="#b88a6c"/>
    <path d="M6 2h52a6 6 0 0 1 6 6v68l-5.5-4-5.5 4-5.5-4-5.5 4-5.5-4-5.5 4-5.5-4-5.5 4-5.5-4L6 76V8a6 6 0 0 1 0-6Z" fill="url(#paper)" stroke="#fffef8"/>
    <rect x="10" y="12" width="26" height="5" rx="2.5" fill="#bda58b"/>
    <rect x="10" y="23" width="40" height="3" rx="1.5" fill="#ddd0bd"/>
    <rect x="10" y="35" width="34" height="3" rx="1.5" fill="#c6b298"/>
    <rect x="10" y="45" width="28" height="3" rx="1.5" fill="#c6b298"/>
    <rect x="10" y="57" width="22" height="7" rx="3.5" fill="#d98264"/>
  </g>

  <!-- Preparing ticket: honey timer. -->
  <g transform="translate(176 46) rotate(2)" filter="url(#floatShadow)">
    <rect x="22" y="-6" width="20" height="10" rx="3" fill="#b88a6c"/>
    <path d="M6 2h52a6 6 0 0 1 6 6v68l-5.5-4-5.5 4-5.5-4-5.5 4-5.5-4-5.5 4-5.5-4-5.5 4-5.5-4L6 76V8a6 6 0 0 1 0-6Z" fill="url(#paper)" stroke="#fffef8"/>
    <rect x="10" y="12" width="30" height="5" rx="2.5" fill="#bda58b"/>
    <rect x="10" y="23" width="36" height="3" rx="1.5" fill="#ddd0bd"/>
    <rect x="10" y="35" width="42" height="3" rx="1.5" fill="#c6b298"/>
    <rect x="10" y="45" width="30" height="3" rx="1.5" fill="#c6b298"/>
    <g transform="translate(36 50)" filter="url(#smallShadow)">
      <rect width="22" height="22" rx="7" fill="url(#honey)" stroke="#fff3d6"/>
      <circle cx="11" cy="11" r="5.5" stroke="#fffaf0" stroke-width="2"/>
      <path d="M11 8v3l2 1.5" stroke="#fffaf0" stroke-width="1.8" stroke-linecap="round"/>
    </g>
  </g>

  <!-- Ready ticket: sage check. -->
  <g transform="translate(260 46) rotate(7)" filter="url(#floatShadow)">
    <rect x="22" y="-6" width="20" height="10" rx="3" fill="#b88a6c"/>
    <path d="M6 2h52a6 6 0 0 1 6 6v68l-5.5-4-5.5 4-5.5-4-5.5 4-5.5-4-5.5 4-5.5-4-5.5 4-5.5-4L6 76V8a6 6 0 0 1 0-6Z" fill="url(#paper)" stroke="#fffef8"/>
    <rect x="10" y="12" width="24" height="5" rx="2.5" fill="#bda58b"/>
    <rect x="10" y="23" width="42" height="3" rx="1.5" fill="#ddd0bd"/>
    <rect x="10" y="35" width="30" height="3" rx="1.5" fill="#c6b298"/>
    <rect x="10" y="45" width="38" height="3" rx="1.5" fill="#c6b298"/>
    <g transform="translate(36 50)" filter="url(#smallShadow)">
      <rect width="22" height="22" rx="7" fill="url(#badge)" stroke="#dfebcd"/>
      <path d="m6.5 11 3.5 3.5 6-7" stroke="#fffdf0" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Plinth. -->
  <ellipse cx="210" cy="272" rx="140" ry="18" fill="#9a785a" opacity=".16" filter="url(#groundShadow)"/>
  <path d="M70 236c0-27 63-48 140-48s140 21 140 48v13c0 27-63 48-140 48S70 276 70 249v-13Z" fill="url(#platformSide)"/>
  <ellipse cx="210" cy="236" rx="140" ry="48" fill="url(#platformTop)"/>
  <ellipse cx="210" cy="235" rx="138" ry="46" stroke="#fffdf7" stroke-width="1.5"/>

  <!-- Sauté pan with a simmering dish and soft steam. -->
  <ellipse cx="206" cy="242" rx="70" ry="13" fill="#aa8d6e" opacity=".2" filter="url(#groundShadow)"/>
  <g filter="url(#softShadow)">
    <path d="M262 214l58-14c7-2 11 6 4 9l-56 18-6-13Z" fill="#8f3c27"/>
    <path d="M262 211l58-14c7-2 11 6 4 9l-56 18-6-13Z" fill="url(#clay)"/>
    <path d="M140 212c2 18 30 30 66 30s64-12 66-30H140Z" fill="url(#panBody)"/>
    <ellipse cx="206" cy="212" rx="66" ry="20" fill="#f3d4c2" stroke="#fff3e8" stroke-width="1.5"/>
    <ellipse cx="206" cy="213" rx="56" ry="15" fill="url(#sauce)"/>
    <circle cx="186" cy="211" r="6" fill="#a0b38d"/><circle cx="184" cy="209" r="2" fill="#d5e1c3"/>
    <circle cx="212" cy="216" r="5.5" fill="#dc7355"/><circle cx="210" cy="214" r="1.8" fill="#ffd0b8"/>
    <circle cx="228" cy="207" r="5" fill="#a0b38d"/>
    <path d="m196 206 9-3m14 12 8 2m-48 0 7-2" stroke="#fff6e5" stroke-width="2.4" stroke-linecap="round"/>
  </g>
  <path d="M186 180c-7-9 7-13 0-23M206 174c-7-9 7-13 0-23M226 180c-7-9 7-13 0-23" stroke="#d9c6b0" stroke-width="3" stroke-linecap="round" opacity=".75"/>

  <!-- Toque. -->
  <g transform="translate(92 176)" filter="url(#softShadow)">
    <path d="M6 30h40v20c0 4-9 7-20 7S6 54 6 50V30Z" fill="url(#ivory)" stroke="#fffaf0"/>
    <path d="M6 42c0 4 9 7 20 7s20-3 20-7" stroke="#e1d2bf" stroke-width="1.5"/>
    <path d="M8 32C-6 30-3 8 12 12 13-2 39-2 40 12c15-4 18 18 4 20-7 3-29 3-36 0Z" fill="url(#ivory)" stroke="#fffdf7" stroke-width="1.5"/>
    <path d="M14 18c2-5 7-8 12-8" stroke="#fffefb" stroke-width="3" stroke-linecap="round"/>
  </g>

  <circle cx="330" cy="248" r="13" fill="url(#sageOrb)" filter="url(#smallShadow)"/>
</svg>
