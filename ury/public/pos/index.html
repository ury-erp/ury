<!doctype html>
{% set user_lang = frappe.lang or 'en' %}
{% set is_rtl = user_lang in ['ar', 'he', 'fa', 'ur', 'ku'] %}
<html lang="{{ user_lang }}" dir="{{ 'rtl' if is_rtl else 'ltr' }}">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/assets/ury/pos/ury.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>URY POS</title>
    <script type="module" crossorigin src="/assets/ury/pos/assets/index-BLXc1d0T.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/ury/pos/assets/index-DVh9A6Tw.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.csrf_token = "{{ csrf_token }}";
      if (!window.frappe) window.frappe = {};
      window.app_name = "{{ app_name }}";
      frappe.boot = JSON.parse({{ boot }});
    </script>
  </body>
</html>
