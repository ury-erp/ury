<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>URY Brief - Offline</title>
<style>
:root{--bg:#f7f4ef;--ink:#1c1917;--muted:#57534e;--btn:#1c1917;--btn-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#14110f;--ink:#f5f5f4;--muted:#a8a29e;--btn:#f5f5f4;--btn-ink:#1c1917}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:2rem;font-family:system-ui,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
main{max-width:26rem;text-align:center}
h1{font-size:1.5rem;margin:0 0 .75rem}
p{margin:0 0 .75rem;line-height:1.5;color:var(--muted)}
button{margin-top:1rem;min-height:44px;min-width:44px;border:0;border-radius:.5rem;padding:.7rem 1.2rem;font:inherit;font-weight:600;color:var(--btn-ink);background:var(--btn);cursor:pointer}
button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
</style>
</head>
<body>
<main>
<h1>You are offline</h1>
<p>No saved brief is available on this device yet. Connect once to load today's brief; it will then be available offline.</p>
<button type="button" onclick="location.reload()">Try again</button>
</main>
</body>
</html>
