[project]
name = "ury"
authors = [
    { name = "Tridz Technologies", email = "info@tridz.com"}
]
description = "A Complete Restaurant Order Taking Software"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # "frappe~=15.0.0" # Installed and managed by bench.
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

# These dependencies are only installed when developer mode is enabled
[tool.bench.dev-dependencies]
# package_name = "~=1.1.0"

[tool.ruff]
line-length = 110
target-version = "py310"

# CI (see .github/workflows/test.yml, frontend-lint-test job) runs a
# blocking ruff check against this narrow, currently-clean rule subset --
# the full `select` list below has ~900 pre-existing violations across the
# codebase (see B/E101/etc. in `ignore`), so it can't be blocking yet.
# Safe subset: F821 (undefined names), F632 (`is` with a literal), E9
# (syntax errors), B008 (function calls in mutable default args).
# F811 (redefinitions), F601 (repeated dict keys), and B006 (mutable
# defaults) were considered but dropped -- each has existing violations in
# product code (ury/setup/demo.py, ury/setup_customizations.py,
# ury/ury/api/ury_kot_generate.py, ury/ury/doctype/sub_pos_closing/, ury/ury/hooks/ury_pos_opening_entry.py),
# so making them blocking would require touching product code, which is
# out of scope here.

[tool.ruff.lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "RUF",
]
ignore = [
    "B017", # assertRaises(Exception) - should be more specific
    "B018", # useless expression, not assigned to anything
    "B023", # function doesn't bind loop variable - will have last iteration's value
    "B904", # raise inside except without from
    "E101", # indentation contains mixed spaces and tabs
    "E402", # module level import not at top of file
    "E501", # line too long
    "E741", # ambiguous variable name
    "F401", # "unused" imports
    "F403", # can't detect undefined names from * import
    "F405", # can't detect undefined names from * import
    "F722", # syntax error in forward type annotation
    "W191", # indentation contains tabs
]
typing-modules = ["frappe.types.DF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
docstring-code-format = true
