<!doctype html>
{% set user_lang = frappe.lang or 'en' %}
{% set is_rtl = user_lang in ['ar', 'he', 'fa', 'ur', 'ku'] %}
<html lang="{{ user_lang }}" dir="{{ 'rtl' if is_rtl else 'ltr' }}">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/ury.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Lets browsers install the POS as an app (no offline support). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="URY POS" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <title>URY POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      window.csrf_token = "{{ csrf_token }}";
      if (!window.frappe) window.frappe = {};
      window.app_name = "{{ app_name }}";
      frappe.boot = JSON.parse({{ boot }});
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
