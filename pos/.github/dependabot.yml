version: 2
updates:
  # Enable version updates for npm
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    open-pull-requests-limit: 5
    reviewers:
      - 'ury-erp'
    labels:
      - 'dependencies'
      - 'automated'
    commit-message:
      prefix: 'chore'
      include: 'scope'
    groups:
      dev-dependencies:
        patterns:
          - '@testing-library/*'
          - '@types/*'
          - 'eslint*'
          - 'typescript*'
          - 'vitest'
          - '@vitest/*'
          - '@playwright/*'
        update-types:
          - 'minor'
          - 'patch'
      production-dependencies:
        patterns:
          - 'react*'
          - 'recharts'
          - 'zustand'
          - 'tailwindcss*'
        update-types:
          - 'patch'

  # Enable version updates for GitHub Actions
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'monthly'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci'
      include: 'scope'
